<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FDL Instructor Mode</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    body { overflow: auto; }
    .admin { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }
    .admin-main { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: 0; }
    .admin .content { padding: 18px 22px 60px; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .form-grid .wide { grid-column: span 2; }
    .form-grid .full { grid-column: 1 / -1; }
    .preview { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .preview > div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    .preview .k { font-size: 11px; color: var(--muted); }
    .preview .v { font-family: var(--mono); font-weight: 700; font-size: 16px; }
    .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 6px; overflow: hidden; }
    .seg button { background: var(--panel-2); border: 0; padding: 4px 10px; cursor: pointer; color: var(--text-2); font-size: 12px; }
    .seg button.on { background: var(--accent-2); color: #fff; }
    .compare-cols { display: grid; gap: 12px; grid-auto-flow: column; grid-auto-columns: minmax(280px, 1fr); overflow-x: auto; padding-bottom: 6px; }
    .compare-cols .card { max-height: 640px; overflow-y: auto; }
    .team-dot { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
    .link-box { font-family: var(--mono); font-size: 11px; word-break: break-all; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px; max-height: 110px; overflow: auto; }
    .result-row td { vertical-align: middle; }
    .callout { border-left: 3px solid var(--accent); background: #101c28; padding: 10px 14px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
    @media (max-width: 1100px) { .admin-main { grid-template-columns: 58px minmax(0, 1fr); } .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 760px) { .form-grid, .preview { grid-template-columns: minmax(0, 1fr); } .form-grid .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <div class="admin">
    <header class="topbar">
      <div class="brand"><span class="logo">▣</span>FACTORY DECISION LAB</div>
      <div class="case-name"><b>INSTRUCTOR MODE</b> · 강사용 Case 설정 및 Debrief</div>
      <span class="muted" id="saveState" style="font-size:12px"></span>
      <button class="btn sm" id="saveBtn">이 브라우저에 저장</button>
      <a class="btn sm primary" href="index.html" target="_blank" rel="noopener">교육생 화면 열기 ↗</a>
    </header>
    <div class="admin-main">
      <nav class="sidenav" id="adminNav"></nav>
      <main class="content" id="adminView"></main>
    </div>
  </div>
  <div id="modals"></div>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/model.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/analyst.js"></script>
  <script src="assets/js/scoring.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
