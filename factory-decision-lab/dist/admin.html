      s.values.forEach(function (v, i) {
        var p = pt(i, v);
        svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + s.color + '" class="ring" data-tip="' + esc('<b>' + esc(s.name || '') + '</b><br>' + esc(o.axes[i]) + ': ' + v) + '"/>';
      });
    });
    svg += '</svg>';
    if (o.series.length > 1) {
      svg += '<div class="legend">' + o.series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>';
    }
    return svg;
  }

  /* Global tooltip */
  function initTooltip() {
    var tip = document.createElement('div');
    tip.id = 'fdl-tip';
    document.body.appendChild(tip);
    document.addEventListener('mousemove', function (e) {
      var t = e.target.closest && e.target.closest('[data-tip]');
      if (!t) { tip.style.display = 'none'; return; }
      tip.innerHTML = t.getAttribute('data-tip');
      tip.style.display = 'block';
      var x = e.clientX + 14, y = e.clientY + 14;
      var r = tip.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
  }

  FDL.charts = { line: line, bars: bars, pairedH: pairedH, sparkline: sparkline, radar: radar, initTooltip: initTooltip };
})();

</script>
  <script>
/* ==========================================================================
   FACTORY DECISION LAB — AI Manufacturing Analyst (rule-based, case-bounded)
   원칙: Case 데이터 범위 안에서만 답변 / 원인을 직접 알려주지 않음 / 확인 질문으로 되돌려줌
   ========================================================================== */
(function () {
  var esc = FDL.escape;

  var DIM_WORDS = [
    ['eq', /(설비|eq-?\d*|리플로우|reflow|오븐)/i],
    ['lot', /(lot|로트|랏|페이스트|paste|솔더|원자재)/i],
    ['shift', /(작업조|야간|주간|조별|shift)/i],
    ['pcb', /(pcb|기판)/i],
    ['lane', /(lane|레인|마운터|mounter|실장기)/i],
    ['op', /(작업자|오퍼레이터|operator|신규)/i],
    ['hod', /(시간대|시간별)/i]
  ];

  /* 가설/최종 원인 텍스트 분류 (평가에도 사용) */
  FDL.classify = function (text, cfg) {
    var t = String(text || '');
    var tags = {};
    if (/(lot|로트|랏|페이스트|paste|솔더|flux|플럭스|점도|원자재|자재)/i.test(t) && !/^\s*(pcb|기판)/i.test(t)) tags.material = true;
    var eqm = t.match(/eq-?0?([1-4])/i);
    if (eqm) {
      var id = 'EQ-0' + eqm[1];
      if (cfg && cfg.rootCause.eqId === id) tags.equipment = true; else tags.wrongEq = true;
    }
    if (!tags.wrongEq && /(열전대|히터|heater|thermocouple|tc 편차|온도 편차|실측|profiler|프로파일러)/i.test(t)) tags.equipment = true;
    if (!eqm && /(설비|리플로우|reflow|오븐)/i.test(t)) tags.equipmentGeneric = true;
    if (/(레시피|recipe|rev\.?\s?[cd]|셋팅|세팅|setting|changeover|체인지오버|모델 ?교체|설정 ?오류|조건 ?오류|로드)/i.test(t)) tags.setting = true;
    if (/(pcb|기판)/i.test(t)) tags.pcb = true;
    if (/(신규 ?작업자|신입|김oo|숙련도)/i.test(t)) tags.operator = true;
    if (/(노즐|nozzle|마운터|mounter|실장기)/i.test(t)) tags.nozzle = true;
    if (/(aoi|검사 ?프로그램|오검출|false ?call)/i.test(t)) tags.aoi = true;
    if (/(습도|공조|온습도)/i.test(t)) tags.humidity = true;
    return tags;
  };

  function Analyst(game) { this.g = game; }

  Analyst.prototype.table = function (rows, cols) {
    var h = '<table class="mini"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) { h += '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table>';
  };

  Analyst.prototype.hint = function (level, text) {
    var h = FDL.DIFFICULTY[this.g.cfg.difficulty].hints;
    if (h === 'low') return '';
    if (level === 'high' && h !== 'high') return '';
    return '<p class="hint">💡 ' + text + '</p>';
  };

  Analyst.prototype.dims = function (q) {
    var out = [];
    DIM_WORDS.forEach(function (d) { if (d[1].test(q) && out.indexOf(d[0]) < 0) out.push(d[0]); });
    return out;
  };

  Analyst.prototype.period = function (q) {
    if (/(오늘|금일)/.test(q)) return 'today';
    if (/(24|하루|어제)/.test(q)) return '24h';
    return '48h';
  };

  Analyst.prototype.periodLabel = function (p) {
    return p === 'today' ? '오늘 08:00~현재' : p === '24h' ? '최근 24시간' : '최근 48시간';
  };

  Analyst.prototype.hidden = function (moduleId) {
    return !FDL.isVisible(this.g.cfg, moduleId);
  };

  Analyst.prototype.stratAnswer = function (dim, period) {
    if (this.hidden('quality.strat')) return this.notProvided();
    var m = this.g.model, rows = m.strat(dim, period);
    var max = Math.max.apply(null, rows.map(function (r) { return r.defect; }));
    var min = Math.min.apply(null, rows.map(function (r) { return r.defect; }));
    var html = '<p>' + esc(FDL.STRAT_DIMS[dim].label) + '별 불량률을 비교했습니다. <span class="muted">(' + this.periodLabel(period) + ')</span></p>';
    html += this.table(rows.map(function (r) {
      return ['<b>' + esc(r.label) + '</b>', '<span class="' + (r.defect === max && max - min > 1 ? 'hi' : '') + '">' + r.defect.toFixed(1) + '%</span>', r.units.toLocaleString()];
    }), [FDL.STRAT_DIMS[dim].label, '불량률', '생산수량']);
    var top = rows.filter(function (r) { return r.defect === max; })[0];
    if (max - min > 1.2) html += '<p>' + esc(top.label) + ' 에서 상대적으로 높은 불량률이 확인됩니다.</p>';
    else html += '<p>그룹 간 뚜렷한 차이는 관찰되지 않습니다.</p>';
    if (dim === 'eq') html += this.hint('mid', '특정 설비의 차이가 “언제부터” 시작됐는지, 다른 요인과 겹치는지도 확인해 보시겠습니까?');
    if (dim === 'lot') html += this.hint('mid', 'Lot 전환 시점과 불량 상승 시점이 일치하는지, 설비별로 동일하게 나타나는지 확인해 보시겠습니까?');
    if (dim === 'pcb' || dim === 'op' || dim === 'lane') html += this.hint('mid', '이 차이가 다른 변수와 겹쳐서(교란) 나타난 것은 아닌지 교차 분석으로 확인할 수 있습니다.');
    if (dim === 'shift') html += this.hint('mid', '조별 차이가 “사람” 때문인지, 그 시간대에 “무언가 바뀐 것” 때문인지 구분이 필요합니다.');
    return { html: html, key: 'strat.' + dim, label: 'AI 분석: ' + FDL.STRAT_DIMS[dim].label + '별 비교' };
  };

  Analyst.prototype.crossAnswer = function (a, b, period) {
    if (this.hidden('quality.cross')) return this.notProvided();
    var c = this.g.model.cross(a, b, period);
    var html = '<p>' + esc(FDL.STRAT_DIMS[a].label) + ' × ' + esc(FDL.STRAT_DIMS[b].label) + ' 교차 분석 결과입니다. <span class="muted">(' + this.periodLabel(period) + ')</span></p>';
    html += this.table(c.rows.map(function (r, i) {
      return ['<b>' + esc(r) + '</b>'].concat(c.m[i].map(function (cell) { return cell ? cell.v.toFixed(1) + '%' : '<span class="muted">—</span>'; }));
    }), [''].concat(c.cols));
    html += '<p>교차 조건에 따라 불량률 편차가 다르게 나타납니다. 어떤 조합에서 차이가 커지는지 확인해 보십시오.</p>';
    return { html: html, key: 'cross.' + [a, b].sort().join('x'), label: 'AI 분석: ' + FDL.STRAT_DIMS[a].label + ' × ' + FDL.STRAT_DIMS[b].label };
  };

  Analyst.prototype.notProvided = function () {
    return { html: '<p>해당 데이터는 이번 교육 세션에서 제공되지 않습니다. 다른 관점의 데이터로 판단해 주십시오.</p>', key: null, label: 'AI 질의 (비공개 데이터)' };
  };

  Analyst.prototype.answer = function (raw) {
    var q = String(raw || '').trim();
    var g = this.g, m = g.model, cfg = g.cfg, rc = cfg.rootCause, self = this;
    var snap = m.snapshot();
    if (this.hidden('analyst')) return { html: '<p>AI Analyst 가 비활성화되어 있습니다.</p>' };

    // 1) 정답 요구 → 원인 직접 제시 금지
    if (/(정답|답 ?알려|원인.*(뭐|무엇|알려|말해)|뭐가 문제|어떻게 해야|해결책|결론 ?내려)/.test(q)) {
      var notSeen = [];
      if (!g.evidence['strat.eq']) notSeen.push('설비별 비교');
      if (!g.evidence['strat.lot']) notSeen.push('원자재 Lot별 비교');
      if (!g.evidence['strat.shift']) notSeen.push('작업조별 비교');
      if (!g.evidence['history.changes']) notSeen.push('4M 변경점 이력');
      var html = '<p>원인에 대한 판단은 책임자님의 몫입니다. 저는 데이터 분석을 지원하겠습니다.</p>' +
        '<p>4M 관점(Man · Machine · Material · Method)으로 가설을 세우고, 각 가설을 지지/반박하는 데이터를 확인해 보시겠습니까?</p>';
      if (notSeen.length) html += this.hint('mid', '아직 확인하지 않은 관점: ' + notSeen.join(', '));
      return { html: html, key: null, label: 'AI 질의: 원인 문의', intent: 'ask_answer' };
    }

    // 2) 원인 단정 → 소크라테스식 되묻기
    if (/(원인|범인|때문|주범|확실)/.test(q) && /(네|다|야|같아|같은데|듯|맞지|맞아|확실|이군|인가\?*$|겠)/.test(q) && !/(비교|보여|분석|알려)/.test(q)) {
      var tags = FDL.classify(q, cfg);
      var subj = q.match(/eq-?0?[1-4]/i) ? q.match(/eq-?0?[1-4]/i)[0].toUpperCase() :
        tags.material ? '원자재 Lot' : tags.setting ? '공정조건/레시피' : tags.operator ? '작업자 요인' : tags.pcb ? 'PCB Lot' : '해당 요인';
      var html2 = '<p>현재 데이터에서는 <b>' + esc(subj) + '</b>와(과) 불량 간 연관성이 관찰됩니다.</p>' +
        '<p>다만 상관관계만으로 원인을 확정하기는 어렵습니다. <b>원인으로 확정하기 위해 어떤 정보를 추가로 확인하시겠습니까?</b></p>' +
        '<ul class="tight"><li>변화 시점과 불량 상승 시점이 일치하는가?</li><li>다른 요인과 겹쳐 나타난 것은 아닌가? (교차 분석)</li><li>그 요인만 제거·변경했을 때 불량이 재현/해소되는가?</li><li>하나의 요인으로 전체 현상이 설명되는가?</li></ul>';
      return { html: html2, key: null, label: 'AI 대화: 원인 주장 “' + q.slice(0, 40) + '”', intent: 'claim' };
    }

    // 3) 교차 분석
    var dims = this.dims(q);
    var period = this.period(q);
    if (dims.length >= 2 && /(교차|별로|×|조합|같이|함께|나눠|x)/i.test(q)) return this.crossAnswer(dims[0], dims[1], period);

    // 4) 레시피/공정조건
    if (/(레시피|recipe|rev|버전|프로파일|profile|셋팅|세팅|setting|공정 ?조건|설정 ?온도|존 ?온도|zone)/i.test(q)) {
      var html3 = '<p>Reflow 설비별 현재 로드 레시피와 주요 설정값입니다.</p>';
      html3 += this.table(FDL.EQUIPMENT.map(function (id) {
        var z = m.zoneTable(id);
        return ['<b>' + id + '</b>', 'PM220_RF_' + m.recipeOf(id), z[2].sv + ' / ' + z[3].sv, z[5].sv, z[5].out + '%'];
      }), ['설비', '레시피', 'Soak Z3/Z4(°C)', 'Peak Z6(°C)', 'Z6 Heater 출력']);
      html3 += '<p class="muted">※ 표시 온도는 설비 자체 열전대 기준값입니다. 실제 기판 온도는 Profiler 실측(설비 점검) 시 확인 가능합니다.</p>';
      html3 += this.hint('mid', '레시피 변경 이력과 설비별 설정 차이가 언제, 누구에 의해 생겼는지 작업일지에서 확인할 수 있습니다.');
      return { html: html3, key: 'analyst.recipe', label: 'AI 분석: 설비별 레시피/공정조건' };
    }

    // 5) 변경점
    if (/(달라진|변경|변화|바뀐|차이점|4m|어제와)/i.test(q)) {
      if (this.hidden('history.changes')) return this.notProvided();
      var html4 = '<p>최근 48시간 등록된 4M 변경점입니다. (변경점 관리대장 기준)</p>';
      html4 += this.table(g.changeLog().map(function (c) { return [c.when, c.cat, esc(c.item)]; }), ['일시', '구분', '변경 내용']);
      html4 += '<p class="muted">※ 변경점 관리대장에 등록되지 않은 작업(예: 교대 중 Changeover)은 작업일지에서 확인해야 합니다.</p>';
      return { html: html4, key: 'history.changes', label: 'AI 분석: 변경점 조회' };
    }

    // 6) 단일 차원 층별
    if (dims.length === 1 && dims[0] !== 'hod' || /(비교|별 ?불량|층별)/.test(q) && dims.length) {
      return this.stratAnswer(dims[0], period);
    }

    // 7) 추이/시간
    if (/(추이|트렌드|trend|시간대|언제부터|시작|시점|7일|일주일)/i.test(q)) {
      if (this.hidden('quality.hourly')) return this.notProvided();
      var hr = m.hourly();
      var picks = [];
      for (var i = 0; i < hr.labels.length; i += 2) picks.push([hr.labels[i], hr.overall[i].toFixed(1) + '%']);
      var html5 = '<p>최근 24시간 시간대별 라인 불량률 (2시간 간격 표시)</p>' + this.table(picks, ['시각', '불량률']);
      html5 += '<p>상승이 관찰되는 구간이 있습니다. 해당 시각 전후의 변경 사항과 대조해 보시겠습니까?</p>';
      return { html: html5, key: 'quality.hourly', label: 'AI 분석: 시간대별 추이' };
    }

    if (/(유형|pareto|파레토|모드|종류)/i.test(q)) {
      var p = m.pareto();
      var html6 = '<p>불량 유형별 비율 (평시 → 현재, 라인 불량률 기여 %p)</p>' + this.table(p.map(function (r) { return [esc(r.label), r.baseline.toFixed(2), '<b>' + r.today.toFixed(2) + '</b>']; }), ['유형', '평시', '현재']);
      html6 += '<p>증가폭이 큰 유형이 어느 공정(인쇄·실장·리플로우)과 관련이 깊은지 생각해 보십시오.</p>';
      return { html: html6, key: 'quality.pareto', label: 'AI 분석: 불량 유형' };
    }

    if (/(습도|온습도|환경|공조)/.test(q)) {
      return { html: '<p>SMT 동 공조: 온도 24.1°C / 습도 55~58%RH (관리기준 40~60%RH, 어제 19:30 설정 50→55% 변경). 관리기준 내에서 운영 중입니다.</p>', key: 'env.humidity', label: 'AI 분석: 환경 조건' };
    }
    if (/(aoi|검사기|오검출|false)/i.test(q)) {
      return { html: '<p>AOI-01 프로그램 v3.2 (D-2 16:00 업데이트). False Call 률 0.8% → 0.9%. X-ray 샘플 재판정 결과 AOI 불량 판정 일치율 97% 입니다.</p>', key: 'aoi', label: 'AI 분석: AOI 검사' };
    }
    if (/(알람|alarm|경고)/i.test(q)) {
      var rows = [];
      FDL.EQUIPMENT.forEach(function (id) { m.alarms(id).forEach(function (a) { rows.push([id, a.time, esc(a.msg)]); }); });
      return { html: '<p>최근 48시간 Reflow 설비 알람 이력입니다.</p>' + this.table(rows, ['설비', '일시', '내용']), key: 'eq.alarms', label: 'AI 분석: 설비 알람 이력' };
    }
    if (/(타 ?라인|line ?3|라인 ?3|다른 라인)/i.test(q)) {
      if (!m.s.unlocked.line3) return { html: '<p>현재 타 라인에서 보고된 이상 정보는 없습니다.</p>', key: null, label: 'AI 질의: 타 라인' };
      return { html: '<p>' + g.line3Text() + '</p>', key: 'line3', label: 'AI 분석: 타 라인 정보' };
    }
    if (/(재고|대체)/.test(q)) {
      var st = m.s.oldStock == null ? FDL.actionParam(cfg, 'quarantine_lot', 'stockMin') : Math.max(0, Math.round(m.s.oldStock));
      return { html: '<p>이전 Paste Lot SP-0911A 잔량: 약 ' + st + '분 생산 분량 (Full Rate 기준). 대체 신규 Lot 은 공급사 확인이 필요합니다.</p>', key: 'material.stock', label: 'AI 분석: 대체 자재 재고' };
    }
    if (/(납기|출하|생산량|계획|물량)/.test(q)) {
      return { html: '<p>금일 18:00 출하 요구: <b>' + cfg.kpi.shipmentTarget.toLocaleString() + 'ea</b> · 현재 예상 출하 가능: <b>' + Math.round(snap.projected).toLocaleString() + 'ea</b> (' + Math.round(snap.deliveryRatio * 100) + '%)</p><p>계획 대비 생산 ' + snap.production.toFixed(1) + '% · 완제품 재고 ' + cfg.kpi.fgStock.toLocaleString() + 'ea (어제 14:00 이후 생산분 포함)</p>', key: 'production.plan', label: 'AI 분석: 납기/출하' };
    }
    if (/(고객)/.test(q)) {
      return { html: '<p>고객사: 완성차 Tier-1 전장 모듈 업체. 최근 90일 클레임 0건. 현재 고객 Risk 는 ' + snap.customer + ' 입니다. 유출 가능 수량은 불량률·검사 방식·출하 여부에 따라 달라집니다.</p>', key: 'customer', label: 'AI 분석: 고객 현황' };
    }
    if (/(불량률|불량|수율)/.test(q)) {
      return this.stratAnswer('eq', 'today');
    }
    return {
      html: '<p>Case 데이터 범위 안에서 분석을 도와드립니다. 예를 들어 이렇게 요청해 보세요.</p><ul class="tight">' +
        ['설비별 불량률 비교해줘', '어제와 오늘 달라진 조건이 뭐야?', 'Lot별로 비교해줘', '야간조와 주간조 차이가 있어?', '설비별로 Lot 교차 분석해줘', '설비별 레시피 확인해줘', '시간대별 추이 보여줘']
          .map(function (s) { return '<li><a href="#" class="ask" data-q="' + esc(s) + '">' + esc(s) + '</a></li>'; }).join('') + '</ul>',
      key: null, label: 'AI 질의: “' + q.slice(0, 30) + '”'
    };
  };

  FDL.Analyst = Analyst;
})();

</script>
  <script>
/* ==========================================================================
   FACTORY DECISION LAB — Debrief Scoring
   “무엇을 맞혔는가”가 아니라 “어떻게 판단했는가”를 행동 로그 기반으로 분석
   ========================================================================== */
(function () {
  var FACTOR_LABEL = { material: '원자재 Lot 변경 (Material)', equipment: '설비 조건 이상 (Machine)', setting: '작업 Setting 오류 (Method/Man)' };
  var EVID_FACTOR = function (key, cfg) {
    var rc = cfg.rootCause;
    var f = [];
    if (/^(strat\.lot|material\.coa|material\.lots|material\.pcn|line3|cross\..*lot)/.test(key)) f.push('material');
    if (/^(strat\.eq|eq\.alarms|cross\..*eq)/.test(key) || key === 'eq.detail.' + rc.eqId || key === 'eq.inspect.' + rc.eqId) f.push('equipment');
    if (/^(analyst\.recipe|people\.worklog|history\.incidents)/.test(key) || key === 'eq.detail.' + rc.eqId || key === 'eq.inspect.' + rc.eqId) f.push('setting');
    return f;
  };
  var NOISE_KEYS = /^(strat\.(pcb|lane|op)|env\.|aoi|process\.mounter)/;
  var CAT_OF = function (key) {
    if (/(lot|material|pcb|line3)/.test(key)) return 'Material';
    if (/(eq|equipment|lane|mounter|alarms)/.test(key)) return 'Machine';
    if (/(shift|op|people)/.test(key)) return 'Man';
    if (/(recipe|history|changes|incidents)/.test(key)) return 'Method';
    return null;
  };

  function levelOf(v) { return v >= 80 ? '탁월' : v >= 65 ? '우수' : v >= 50 ? '보통' : v >= 35 ? '개선 필요' : '집중 개발 필요'; }
  function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

  FDL.activeFactors = function (cfg) {
    var rc = cfg.rootCause, f = [];
    if (rc.material) f.push('material');
    if (rc.eqId && rc.tcDrift) f.push('equipment');
    if (rc.eqId && rc.recipeError) f.push('setting');
    return f;
  };
  FDL.FACTOR_LABEL = FACTOR_LABEL;

  FDL.timelineHtml = function (log, all) {
    var TYPE = { system: 'SYSTEM', view: 'EXPLORE', query: 'AI', hyp: 'HYPOTHESIS', hyp_update: 'HYPOTHESIS', decision: 'DECISION', event: 'EVENT', kpi: 'KPI', final: 'FINAL', ack: 'ACK' };
    return log.filter(function (l) {
      if (l.type === 'ack') return false;
      if (all) return true;
      return l.type !== 'view' && l.type !== 'query' || (l.key && /^(strat|cross|material|people\.worklog|history|analyst|line3|eq\.detail|quality\.(trend|pareto))/.test(l.key));
    }).map(function (l) {
      var sub = '';
      if (l.type === 'decision') sub = '근거: ' + l.data.rationale + '\n결과: 불량률 ' + l.data.before.defect + '→' + l.data.after.defect + '%, 생산량 ' + l.data.before.production + '→' + l.data.after.production + '%, 납기 ' + l.data.before.delivery + '→' + l.data.after.delivery;
      if (l.type === 'event' && l.data) sub = l.data.lines[0];
      if (l.type === 'hyp' && l.data && l.data.evidence) sub = '근거: ' + l.data.evidence;
      return '<div class="tl-item tl-' + l.type + '"><div class="tl-t">' + l.clock + '</div><div><span class="tl-type">' + (TYPE[l.type] || l.type) + '</span>' + FDL.escape(l.label) + (sub ? '<div class="tl-sub">' + FDL.escape(sub) + '</div>' : '') + '</div></div>';
    }).join('');
  };

  FDL.score = function (game) {
    var cfg = game.cfg, log = game.log, rc = cfg.rootCause;
    var active = FDL.activeFactors(cfg);
    var clock = function (t) { return game.model.clock(t); };
    var first = function (pred) { for (var i = 0; i < log.length; i++) if (pred(log[i])) return log[i]; return null; };
    var evid = game.evidence; // key -> first t
    var factorFirst = {};
    Object.keys(evid).forEach(function (k) {
      EVID_FACTOR(k, cfg).forEach(function (f) { if (factorFirst[f] == null || evid[k] < factorFirst[f]) factorFirst[f] = evid[k]; });
    });
    var decisions = log.filter(function (l) { return l.type === 'decision'; });
    var events = log.filter(function (l) { return l.type === 'event' && l.data && l.data.major; });
    var hyps = game.hypotheses;
    var fin = game.final || {};
    var hist = game.model.history;
    var start = game.startRec || hist[0] || {}, end = hist[hist.length - 1] || {};
    var R = {};

    /* ---------- SA : Situation Awareness ---------- */
    (function () {
      var s = 0, fb = [], ev = [];
      var q = first(function (l) { return (l.type === 'view' || l.type === 'query') && /^(quality|strat|cross)/.test(l.key || ''); });
      if (q) {
        s += q.t <= 3 ? 40 : q.t <= 7 ? 30 : q.t <= 12 ? 18 : 8;
        ev.push(q.clock + ' 첫 품질 데이터 확인');
        if (q.t <= 5) fb.push('Alert 직후 ' + q.clock + '에 품질 데이터를 확인하며 빠르게 상황 파악에 착수했습니다.');
        else fb.push('첫 품질 데이터 확인이 ' + q.clock + '로 다소 늦었습니다. Alert 직후 “무엇이, 언제부터, 얼마나” 변했는지 먼저 확인하는 습관이 필요합니다.');
      } else fb.push('품질 데이터를 직접 확인하지 않았습니다. 현상의 규모와 시작 시점 파악이 판단의 출발점입니다.');
      if (evid['quality.trend7d'] != null || evid['quality.hourly'] != null) s += 15; else fb.push('시간 추이(Trend) 확인이 없어 “언제부터” 문제가 시작됐는지 판단 근거가 약했습니다.');
      if (evid['quality.pareto'] != null) s += 15; else fb.push('불량 유형(Pareto)을 보지 않아 관련 공정을 좁히는 단서를 놓쳤습니다.');
      // 이벤트 반응성
      var responded = 0;
      events.forEach(function (e) {
        var r = log.some(function (l) { return (l.type === 'decision' || l.type === 'view' || l.type === 'query' || l.type === 'hyp') && l.t >= e.t && l.t <= e.t + 8; });
        if (r) responded++;
      });
      if (events.length) {
        s += 30 * responded / events.length;
        if (responded < events.length) fb.push('발생한 주요 Event ' + events.length + '건 중 ' + (events.length - responded) + '건은 8분 이내 후속 확인/조치가 없었습니다.');
        else fb.push('주요 Event 발생 시마다 8분 이내 후속 확인 또는 조치를 이어갔습니다.');
      } else s += 15;
      R.SA = { score: clamp(s), feedback: fb, evidence: ev };
    })();

    /* ---------- DA : Data Analysis ---------- */
    (function () {
      var s = 0, fb = [];
      var covered = active.filter(function (f) { return factorFirst[f] != null; });
      s += active.length ? 45 * covered.length / active.length : 45;
      var cats = {};
      Object.keys(evid).forEach(function (k) { var c = CAT_OF(k); if (c) cats[c] = true; });
      var nCats = Object.keys(cats).length;
      s += Math.min(20, nCats * 5);
      var crossUsed = Object.keys(evid).some(function (k) { return /^cross\./.test(k); });
      if (crossUsed) { s += 15; fb.push('교차 분석을 활용해 요인 간 결합(교란) 여부를 검토했습니다.'); }
      else fb.push('단일 층별 비교에 머물렀습니다. 복합 원인은 교차 분석(예: 설비 × Lot)에서 드러나는 경우가 많습니다.');
      var queries = log.filter(function (l) { return l.type === 'query' && l.key; }).length;
      if (queries >= 3) s += 10;
      var noise = Object.keys(evid).filter(function (k) { return NOISE_KEYS.test(k); }).length;
      var signal = Object.keys(evid).filter(function (k) { return EVID_FACTOR(k, cfg).length; }).length;
      if (signal >= noise) s += 10; else fb.push('Noise 성격의 데이터(' + noise + '건) 확인 비중이 핵심 데이터(' + signal + '건)보다 컸습니다. 가설 기반으로 탐색 범위를 좁혀 보십시오.');
      // 탐색 순서 피드백
      var order = active.filter(function (f) { return factorFirst[f] != null; }).sort(function (a, b) { return factorFirst[a] - factorFirst[b]; });
      if (order.length >= 2) {
        var f0 = order[0], fl = order[order.length - 1];
        if (factorFirst[fl] - factorFirst[f0] >= 12) fb.push(FACTOR_LABEL[f0] + ' 데이터에 먼저 집중하면서(' + clock(factorFirst[f0]) + '), ' + FACTOR_LABEL[fl] + ' 확인이 ' + clock(factorFirst[fl]) + '로 늦었습니다.');
        else fb.push('여러 원인 후보 데이터를 비교적 균형 있게 탐색했습니다 (' + order.map(function (f) { return FACTOR_LABEL[f].split(' (')[0] + ' ' + clock(factorFirst[f]); }).join(', ') + ').');
      }
      active.forEach(function (f) { if (factorFirst[f] == null) fb.push(FACTOR_LABEL[f] + ' 관련 데이터를 확인하지 않았습니다.'); });
      R.DA = { score: clamp(s), feedback: fb, cats: Object.keys(cats) };
    })();

    /* ---------- HQ : Hypothesis Quality ---------- */
    (function () {
      var s = 0, fb = [];
      var n = hyps.length;
      s += n >= 3 ? 15 : n === 2 ? 10 : n === 1 ? 5 : 0;
      if (!n) fb.push('가설을 등록하지 않았습니다. 가설 없이 탐색하면 데이터가 판단으로 연결되기 어렵습니다.');
      var hypTags = {};
      hyps.forEach(function (h) { var t = FDL.classify(h.title + ' ' + h.evidence, cfg); Object.keys(t).forEach(function (k) { hypTags[k] = true; }); });
      var hypCovered = active.filter(function (f) { return hypTags[f]; });
      s += active.length ? 20 * hypCovered.length / active.length : 20;
      var withEvidence = hyps.filter(function (h) { return (h.evidence || '').trim().length >= 15; }).length;
      if (n) { s += 10 * withEvidence / n; if (withEvidence < n) fb.push('근거가 비어 있거나 짧은 가설이 ' + (n - withEvidence) + '건 있습니다. “어떤 데이터가 이 가설을 지지하는가”를 기록하십시오.'); }
      var updates = log.filter(function (l) { return l.type === 'hyp_update'; }).length;
      var rejected = hyps.filter(function (h) { return h.status === '기각'; }).length;
      if (updates) { s += 10; fb.push('가설의 가능성·상태를 ' + updates + '회 갱신하며 데이터에 따라 판단을 수정했습니다.'); }
      if (rejected) s += 5;
      // 최종 Root Cause
      var finTags = FDL.classify(fin.rootCauseText || '', cfg);
      var IDX = [null, null, null, 'pcb', 'operator', 'nozzle', 'aoi', 'humidity'];
      (fin.rcSel || []).forEach(function (x) {
        if (x.i === 0) finTags.material = true;
        else if (x.i === 1 || x.i === 2) {
          if (x.eq === rc.eqId) finTags[x.i === 1 ? 'equipment' : 'setting'] = true; else finTags.wrongEq = true;
        } else if (IDX[x.i]) finTags[IDX[x.i]] = true;
      });
      var finCovered = active.filter(function (f) { return finTags[f]; });
      var falsePos = ['pcb', 'operator', 'nozzle', 'aoi', 'humidity', 'wrongEq'].filter(function (k) { return finTags[k]; });
      if (!rc.material && finTags.material) falsePos.push('material');
      s += active.length ? 30 * finCovered.length / active.length : 30;
      s -= falsePos.length * 4;
      if (active.length > 1) {
        if (finCovered.length === active.length) fb.push('최종 판단에서 복합 원인 구조(' + active.map(function (f) { return FACTOR_LABEL[f].split(' (')[0]; }).join(' + ') + ')를 모두 식별했습니다.');
        else if (finCovered.length) fb.push('최종 판단에서 일부 원인(' + finCovered.map(function (f) { return FACTOR_LABEL[f].split(' (')[0]; }).join(', ') + ')만 식별했습니다. 하나의 원인을 찾은 뒤에도 “이것으로 전체 현상이 설명되는가?”를 점검하십시오.');
        else fb.push('최종 Root Cause 에 실제 원인 요인이 포함되지 않았습니다.');
      } else if (finCovered.length === active.length) fb.push('최종 판단에서 실제 원인을 식별했습니다.');
      if (falsePos.length) fb.push('최종 원인에 Noise 요인(' + falsePos.join(', ') + ')이 포함되었습니다. 상관관계와 인과관계를 구분하는 검증이 필요합니다.');
      if (finCovered.length >= 2 || hypCovered.length >= 2) s += 10;
      R.HQ = { score: clamp(s), feedback: fb, finCovered: finCovered, falsePos: falsePos };
    })();

    /* ---------- DM : Decision Making ---------- */
    (function () {
      var s = 0, fb = [];
      if (!decisions.length) {
        fb.push('게임 중 의사결정을 한 번도 실행하지 않았습니다. 불완전한 정보에서도 “임시 조치”를 먼저 실행하는 판단이 필요합니다.');
      } else {
        var d0 = decisions[0];
        s += d0.t <= 12 ? 25 : d0.t <= 22 ? 18 : d0.t <= 32 ? 10 : 5;
        fb.push('첫 의사결정: ' + d0.clock + ' — ' + d0.data.actions.map(function (a) { return a.label; }).join(', ') + '.');
        var avgLen = decisions.reduce(function (a, d) { return a + (d.data.rationale || '').length; }, 0) / decisions.length;
        var dataRef = decisions.filter(function (d) { return /(\d|%|eq|lot|로트|데이터|비교|추이)/i.test(d.data.rationale || ''); }).length;
        s += Math.min(15, avgLen / 4) + 10 * dataRef / decisions.length;
        if (dataRef < decisions.length) fb.push('판단 근거에 데이터(수치·비교 결과)가 인용되지 않은 결정이 ' + (decisions.length - dataRef) + '건 있습니다.');
        else fb.push('모든 의사결정 근거에 데이터를 인용했습니다.');
      }
      var init = start.defect || 5.8, base = cfg.effects.base;
      var improve = end.defect != null ? (init - end.defect) / Math.max(0.5, init - base) : 0;
      s += 25 * Math.max(0, Math.min(1, improve));
      if (improve >= 0.8) fb.push('불량률을 ' + init + '% → ' + end.defect + '%로 정상 수준에 가깝게 회복시켰습니다.');
      else if (improve > 0.3) fb.push('불량률이 ' + init + '% → ' + end.defect + '%로 개선되었으나 정상 수준(' + base + '%)에는 도달하지 못했습니다.');
      else fb.push('종료 시점 불량률 ' + end.defect + '% — 조치가 현상 개선으로 이어지지 않았습니다.');
      var contained = game.model.s.hold || game.model.s.fullInspection || game.model.s.lineStopped;
      if (contained) { s += 15; } else fb.push('유출 차단 조치(출하 보류·전수검사 등)가 없어 고객 유출 Risk 가 누적되었습니다.');
      var finAct = ((fin.immediate || '') + (fin.production || '')).length;
      s += Math.min(10, finAct / 12);
      R.DM = { score: clamp(s), feedback: fb };
    })();

    /* ---------- TM : Trade-off Management ---------- */
    (function () {
      var s = 0, fb = [];
      var lv = { LOW: 20, MEDIUM: 14, HIGH: 6, CRITICAL: 0 };
      s += lv[end.delivery] || 0;
      s += lv[end.customer] || 0;
      s += end.defect <= 2.6 ? 20 : end.defect <= 3.6 ? 14 : end.defect <= 5 ? 6 : 0;
      s += end.production >= 88 ? 20 : end.production >= 78 ? 14 : end.production >= 60 ? 6 : 0;
      fb.push('종료 KPI — 불량률 ' + end.defect + '%, 생산량 ' + end.production + '%, 납기 Risk ' + end.delivery + ', 고객 Risk ' + end.customer + '.');
      var capLoss = log.filter(function (l) { return l.type === 'kpi' && /납기 Risk/.test(l.label) && /(HIGH|CRITICAL)/.test(l.label); })[0];
      var mitig = decisions.some(function (d) { return d.data.actions.some(function (a) { return /overtime|reduce|restart_eq|resume_all/.test(a.id); }); });
      if (capLoss) {
        if (mitig) { s += 10; fb.push(capLoss.clock + ' 납기 Risk 악화 이후 생산 만회(잔업·재가동·속도 조정) 방안을 함께 검토했습니다.'); }
        else fb.push('품질 조치로 ' + capLoss.clock + ' 납기 Risk 가 악화되었으나 대체 생산계획(잔업·재가동 등) 검토가 부족했습니다.');
      } else s += 5;
      var collab = fin.collaboration || '';
      var parties = ['생산', '품질', '구매', '설비', '고객', '공급사', '영업', '기술'].filter(function (p) { return collab.indexOf(p) >= 0; });
      s += Math.min(6, parties.length * 2);
      if ((fin.customer || '').trim().length >= 20) s += 4; else fb.push('고객 대응 계획이 구체적이지 않습니다. 유출 범위·임시 조치·보고 일정을 포함하십시오.');
      if (parties.length >= 3) fb.push('협업 대상(' + parties.join('·') + ')을 폭넓게 설정했습니다.');
      R.TM = { score: clamp(s), feedback: fb };
    })();

    /* ---------- AD : Adaptability ---------- */
    (function () {
      var s = 0, fb = [];
      var adapted = 0;
      events.forEach(function (e) {
        if (decisions.some(function (d) { return d.t >= e.t && d.t <= e.t + 10; })) adapted++;
      });
      if (events.length) s += 35 * adapted / events.length;
      if (events.length && adapted) fb.push('주요 Event ' + events.length + '건 중 ' + adapted + '건에 대해 10분 이내 재판단(의사결정)을 실행했습니다.');
      else if (events.length) fb.push('새로운 Event 발생 후 판단을 갱신한 기록이 없습니다. 상황이 바뀌면 이전 결정도 재검토 대상입니다.');
      var lateHyp = log.filter(function (l) { return (l.type === 'hyp' || l.type === 'hyp_update') && l.t >= 15; }).length;
      if (lateHyp) { s += 20; fb.push('게임 중·후반(' + (log.filter(function (l) { return (l.type === 'hyp' || l.type === 'hyp_update') && l.t >= 15; })[0].clock) + ' 이후)에도 가설을 추가·수정하며 새 정보를 반영했습니다.'); }
      else fb.push('초기 가설을 이후 정보로 갱신하지 않았습니다.');
      s += decisions.length >= 3 ? 20 : decisions.length === 2 ? 14 : decisions.length === 1 ? 6 : 0;
      var reversed = decisions.some(function (d) { return d.data.actions.some(function (a) { return /restart_eq|resume_all|recipe_reset/.test(a.id); }); });
      if (reversed) { s += 10; fb.push('이전 조치를 재평가해 재가동·조건 복원 등 방향을 조정했습니다.'); }
      var prev = fin.prevention || '';
      if (/(표준|체크리스트|check|인터락|interlock|변경점|4m|교육|검증|승인|자동)/i.test(prev)) { s += 10; fb.push('재발방지 대책에 시스템적 장치(표준·체크리스트·인터락·변경점 관리 등)를 포함했습니다.'); }
      else fb.push('재발방지 대책이 개인 주의 수준에 머물러 있습니다. 표준·인터락·변경점 관리 등 “구조” 차원의 대책을 고려하십시오.');
      if ((fin.monitoring || []).length || (fin.monitoringText || '').length > 5) s += 5;
      R.AD = { score: clamp(s), feedback: fb };
    })();

    var w = cfg.weights || {}, tw = 0, tot = 0;
    FDL.DOMAINS.forEach(function (d) {
      R[d.id].level = levelOf(R[d.id].score);
      var ww = Number(w[d.id] == null ? 1 : w[d.id]); tw += ww; tot += ww * R[d.id].score;
    });

  };

        var d = FDL.DOMAINS.filter(function (x) { return x.id === r[0]; })[0];
        return '<tr><td><b>' + d.label + '</b><div class="muted" style="font-size:12px">' + d.ko + '</div></td><td class="muted" style="font-size:12px">' + r[1] + '</td><td style="width:110px">' + inp('weights.' + r[0], 'num', 'min="0" max="3" step="0.5" style="width:80px"') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  };

  VIEWS.deploy = function () {
    var link = location.href.replace(/admin\.html.*$/, 'index.html') + '#cfg=' + FDL.encodeCfg(cfg);
    return head('배포 · 저장', '설정을 교육생 화면에 적용하는 방법') +
      '<div class="grid c2"><div class="card"><h3>① 같은 PC / 브라우저</h3><p class="muted" style="font-size:13px">“이 브라우저에 저장” 후 같은 브라우저에서 교육생 화면(index.html)을 열면 설정이 적용됩니다. 교육생 결과도 이 브라우저에 자동 저장되어 Debrief 비교가 바로 가능합니다.</p>' +
      '<div class="row"><button class="btn primary" id="saveBtn2">이 브라우저에 저장</button><button class="btn danger" id="resetBtn">기본값으로 초기화</button></div></div>' +
      '<div class="card"><h3>② 교육생 배포 링크 (여러 PC)</h3><p class="muted" style="font-size:13px">설정이 URL 에 포함된 링크입니다. 각 교육생 PC 에서 이 링크로 접속하십시오. 결과는 교육생이 “결과 JSON 저장” 후 강사에게 제출합니다.</p>' +
      '<div class="link-box" id="linkBox">' + esc(link) + '</div><div class="row" style="margin-top:8px"><button class="btn" id="copyLink">링크 복사</button><a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">링크로 열기 ↗</a></div></div>' +
      '<div class="card"><h3>③ 설정 파일</h3><p class="muted" style="font-size:13px">Case 설정을 JSON 파일로 보관하고 다음 차수에 재사용합니다.</p><div class="row"><button class="btn" id="expCfg">설정 JSON 내보내기</button><label class="btn">설정 JSON 불러오기<input type="file" id="impCfg" accept=".json" hidden></label></div></div>' +
      '<div class="card"><h3>현재 설정 요약</h3><table class="data"><tr><td class="muted">Case</td><td>' + esc(cfg.caseName) + '</td></tr><tr><td class="muted">난이도 / 시간</td><td>' + cfg.difficulty + ' / ' + cfg.timeLimitMin + '분 (×' + cfg.speed + ')</td></tr><tr><td class="muted">Root Cause</td><td>' + FDL.activeFactors(cfg).map(function (f) { return FDL.FACTOR_LABEL[f]; }).join(' + ') + (cfg.rootCause.eqId ? ' · ' + cfg.rootCause.eqId : '') + '</td></tr><tr><td class="muted">숨긴 데이터</td><td>' + (Object.keys(cfg.dataVisibility).filter(function (k) { return cfg.dataVisibility[k] === 'hidden'; }).join(', ') || '없음') + '</td></tr></table></div></div>';
  };

  /* ---------------- Debrief ---------------- */
  function allResults() {
    var local = FDL.store.get('fdl.results', []);
    return local.map(function (r) { r._src = '브라우저'; return r; }).concat(imported.map(function (r) { r._src = '파일'; return r; }));
  }
  var TEAM_COLORS = FDL.SERIES;

  VIEWS.debrief = function () {
    var list = allResults();
    var chosen = list.filter(function (r) { return selected[r.id]; }).slice(0, 4);
    var out = head('Debrief — 팀별 Decision Timeline 비교', '순위 경쟁이 아니라 “서로 다른 판단과 그 결과”를 비교하는 화면입니다.') +
      '<div class="card" style="margin-bottom:12px"><h3>결과 목록 <span class="row"><label class="btn sm">결과 JSON 불러오기 (복수)<input type="file" id="impRes" accept=".json" multiple hidden></label><button class="btn sm danger" id="clearRes">브라우저 결과 삭제</button></span></h3>' +
      (list.length ? '<div class="table-wrap"><table class="data"><thead><tr><th>비교</th><th>팀</th><th>Case</th><th>종료</th><th class="num">소요</th><th class="num">의사결정</th><th class="num">가설</th><th>출처</th></tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr class="result-row"><td><input type="checkbox" data-sel="' + esc(r.id) + '"' + (selected[r.id] ? ' checked' : '') + '></td><td><b>' + esc(r.team) + '</b></td><td class="muted" style="font-size:12px">' + esc(r.caseName) + '</td><td class="mono" style="font-size:12px">' + esc((r.finishedAt || '').replace('T', ' ').slice(0, 16)) + '</td><td class="num">' + r.gameMinutes + '분</td><td class="num">' + r.log.filter(function (l) { return l.type === 'decision'; }).length + '</td><td class="num">' + r.hypotheses.length + '</td><td class="muted">' + r._src + '</td></tr>';
        }).join('') + '</tbody></table></div><p class="note">최대 4팀까지 선택해 비교합니다. (팀 목록은 종료 시각 순이며 점수 순위를 표시하지 않습니다)</p>'
        : '<p class="muted">아직 결과가 없습니다. 교육생이 이 브라우저에서 게임을 완료하거나, 제출한 결과 JSON 을 불러오십시오.</p>') + '</div>';
    if (!chosen.length) return out;
    var color = function (i) { return TEAM_COLORS[i % TEAM_COLORS.length]; };
    // 요약 비교
    out += '<div class="card" style="margin-bottom:12px"><h3>판단 경로 요약</h3><div class="table-wrap"><table class="data"><thead><tr><th>항목</th>' + chosen.map(function (r, i) { return '<th><span class="team-dot" style="background:' + color(i) + '"></span>' + esc(r.team) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      [['첫 품질 데이터 확인', function (r) { var x = r.log.filter(function (l) { return (l.type === 'view' || l.type === 'query') && /^(quality|strat|cross)/.test(l.key || ''); })[0]; return x ? x.clock : '—'; }],
        ['첫 가설', function (r) { var h = r.hypotheses[0]; return h ? h.clock + ' ' + esc(h.title) : '—'; }],
        ['첫 의사결정', function (r) { var d = r.log.filter(function (l) { return l.type === 'decision'; })[0]; return d ? d.clock + ' ' + esc(d.data.actions.map(function (a) { return a.label + (a.target ? '(' + a.target + ')' : ''); }).join(', ')) : '—'; }],
        ['의사결정 횟수', function (r) { return r.log.filter(function (l) { return l.type === 'decision'; }).length + '회'; }],
        ['요인별 첫 데이터 확인', function (r) { var ff = (r.score && r.score.factorFirst) || {}; return (r.score.active || []).map(function (f) { return FDL.FACTOR_LABEL[f].split(' (')[0] + ' ' + (ff[f] != null ? clockOf(r, ff[f]) : '✕'); }).join('<br>'); }],
        ['최종 Root Cause', function (r) { return esc(((r.final && r.final.rootCauseChecks) || []).join(' / ')) || '—'; }],
        ['종료 불량률 / 생산량', function (r) { var e = r.history[r.history.length - 1]; return e.defect + '% / ' + e.production + '%'; }],
        ['종료 납기 / 고객 Risk', function (r) { var e = r.history[r.history.length - 1]; return '<span class="lvl ' + e.delivery + '">' + e.delivery + '</span> / <span class="lvl ' + e.customer + '">' + e.customer + '</span>'; }]
      ].map(function (row) { return '<tr><td class="muted">' + row[0] + '</td>' + chosen.map(function (r) { return '<td style="font-size:13px">' + row[1](r) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></div>';
    // 차트
    var maxLen = Math.max.apply(null, chosen.map(function (r) { return r.history.length; }));
    var labels = []; for (var i = 0; i < maxLen; i++) labels.push('T+' + i);
    var pad = function (arr) { var a = arr.slice(); while (a.length < maxLen) a.push(null); return a; };
    out += '<div class="grid c2" style="margin-bottom:12px"><div class="card"><h3>불량률 궤적 비교</h3>' + FDL.charts.line({ labels: labels, width: 560, height: 230, unit: '%', series: chosen.map(function (r, i) { return { name: r.team, color: color(i), values: pad(r.history.map(function (h) { return h.defect; })) }; }) }) + '</div>' +
      '<div class="card"><h3>생산량 궤적 비교</h3>' + FDL.charts.line({ labels: labels, width: 560, height: 230, unit: '%', yMin: 0, yMax: 100, series: chosen.map(function (r, i) { return { name: r.team, color: color(i), values: pad(r.history.map(function (h) { return h.production; })) }; }) }) + '</div></div>';
    out += '<div class="grid c2" style="margin-bottom:12px"><div class="card"><h3>판단 역량 프로필</h3>' + FDL.charts.radar({ axes: FDL.DOMAINS.map(function (d) { return d.ko; }), series: chosen.map(function (r, i) { return { name: r.team, color: color(i), values: FDL.DOMAINS.map(function (d) { return r.score.domains[d.id].score; }) }; }) }) + '</div>' +
      '<div class="card"><h3>Debrief 진행 가이드</h3><ol class="debrief-q"><li>같은 Alert 을 보고 팀마다 <b>처음 확인한 데이터</b>가 달랐습니다. 왜 그것을 먼저 봤습니까?</li><li>첫 의사결정 시점과 조치가 가장 다른 두 팀을 비교해 보십시오. 각 판단의 근거는 무엇이었습니까?</li><li>생산량 궤적이 크게 갈린 지점은 어디입니까? 그 결정의 Trade-off 를 어떻게 설명하겠습니까?</li><li>복합 원인 중 늦게 발견된 요인은 무엇이고, 무엇이 발견을 늦췄습니까?</li><li>우리 현장의 변경점 관리·교대 인수인계에 적용할 교훈은 무엇입니까?</li></ol></div></div>';
    out += '<h2 style="font-size:15px;margin:6px 0 10px">Decision Timeline (팀별 나란히)</h2><div class="compare-cols">' + chosen.map(function (r, i) {
      return '<div class="card"><h3><span><span class="team-dot" style="background:' + color(i) + '"></span>' + esc(r.team) + '</span><span class="tag">' + r.gameMinutes + '분</span></h3><div class="timeline">' + FDL.timelineHtml(r.log, false) + '</div></div>';
    }).join('') + '</div>';
    return out;
  };
  function clockOf(r, t) {
    var x = r.history.filter(function (h) { return h.t === t; })[0];
    if (x) return x.clock;
    var m = 9 * 60 + t; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }

  /* ---------------- render / bind ---------------- */
  function render() {
    renderNav();
    $('#adminView').innerHTML = VIEWS[tab]();
    bind();
  }

  function bind() {
    $$('#adminView [data-path]').forEach(function (el) {
      el.onchange = function () {
        var t = el.getAttribute('data-type'), v;
        if (t === 'bool') v = el.checked;
        else if (t === 'num') v = el.value === '' ? 0 : Number(el.value);
        else v = el.value;
        var path = el.getAttribute('data-path');
        if (path === 'rootCause.eqId' && v === '') v = null;
        set(path, v);
        cfg.caseId = /^(rootCause|effects)/.test(path) ? 'custom' : cfg.caseId;
        setDirty(true);
        if (tab === 'root' || tab === 'kpi') render();
      };
    });
    $$('#adminView [data-preset]').forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-preset'), p = FDL.CASE_PRESETS[k];
        cfg.caseId = k; cfg.caseName = p.caseName;
        cfg.rootCause = FDL.clone(p.rootCause); cfg.effects = FDL.clone(p.effects);
        setDirty(true); render();
      };
    });
    $$('#adminView [data-vis]').forEach(function (b) {
      b.onclick = function () {
        var id = b.getAttribute('data-vis');
        if (b.getAttribute('data-v') === 'hidden') cfg.dataVisibility[id] = 'hidden'; else delete cfg.dataVisibility[id];
        setDirty(true); render();
      };
    });
    $$('#adminView [data-ap]').forEach(function (el) {
      el.onchange = function () {
        var p = el.getAttribute('data-ap').split('.');
        cfg.actionParams[p[0]] = cfg.actionParams[p[0]] || {};
        cfg.actionParams[p[0]][p[1]] = Number(el.value);
        setDirty(true);
      };
    });
    var ad = $('#applyDiff');
    if (ad) ad.onclick = function () { cfg.timeLimitMin = FDL.DIFFICULTY[cfg.difficulty].timeLimitMin; setDirty(true); render(); };
    var s2 = $('#saveBtn2'); if (s2) s2.onclick = save;
    var rb = $('#resetBtn');
    if (rb) rb.onclick = function () { FDL.confirmBox('모든 설정을 기본값으로 초기화하시겠습니까?', function () { cfg = FDL.clone(FDL.DEFAULT_CONFIG); try { localStorage.removeItem('fdl.config'); } catch (e) {} saved = null; setDirty(false); render(); }, '초기화'); };
    var cl = $('#copyLink');
    if (cl) cl.onclick = function () {
      var txt = $('#linkBox').textContent;
      FDL.copyText(txt, function (ok) {
        if (ok) { flash('링크를 복사했습니다.'); return; }
        var r = document.createRange(); r.selectNodeContents($('#linkBox'));
        var sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
        flash('링크를 선택했습니다. Ctrl+C 로 복사하십시오.');
      });
    };
    var ec = $('#expCfg');
    if (ec) ec.onclick = function () { FDL.saveJson(cfg, 'FDL_config_' + (cfg.caseId || 'custom') + '.json'); };
    var ic = $('#impCfg');
    if (ic) ic.onchange = function () {
      readFiles(ic.files, function (objs) {
        if (!objs[0] || !objs[0].rootCause) { FDL.alertBox('올바른 설정 파일이 아닙니다.'); return; }
        cfg = FDL.deepMerge(FDL.clone(FDL.DEFAULT_CONFIG), objs[0]); setDirty(true); render(); flash('설정을 불러왔습니다. 저장을 눌러 적용하십시오.');
      });
    };
    var ir = $('#impRes');
    if (ir) ir.onchange = function () {
      readFiles(ir.files, function (objs) {
        var n = 0;
        objs.forEach(function (o) { if (o && o.app === 'factory-decision-lab') { o.id = o.id || ('f' + Date.now() + Math.random()); imported.push(o); selected[o.id] = true; n++; } });
        flash(n + '개 결과를 불러왔습니다.'); render();
      });
    };
    var cr = $('#clearRes');
    if (cr) cr.onclick = function () { FDL.confirmBox('이 브라우저에 저장된 교육생 결과를 모두 삭제하시겠습니까?', function () { FDL.store.set('fdl.results', []); render(); }, '삭제'); };
    $$('#adminView [data-sel]').forEach(function (cb) {
      cb.onchange = function () {
        var id = cb.getAttribute('data-sel');
        if (cb.checked && Object.keys(selected).filter(function (k) { return selected[k]; }).length >= 4) { cb.checked = false; flash('최대 4팀까지 비교할 수 있습니다.'); return; }
        selected[id] = cb.checked; render();
      };
    });
  }

  function readFiles(files, cb) {
    var arr = Array.prototype.slice.call(files || []), out = [], left = arr.length;
    if (!left) return;
    arr.forEach(function (f) {
      var r = new FileReader();
      r.onload = function () { try { out.push(JSON.parse(r.result)); } catch (e) { FDL.alertBox(f.name + ': JSON 파일을 읽을 수 없습니다.'); } if (--left === 0) cb(out); };
      r.readAsText(f);
    });
  }
  function flash(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.style.bottom = '24px';
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2200);
  }
  function save() {
    if (FDL.store.set('fdl.config', cfg)) { saved = FDL.clone(cfg); setDirty(false); flash('저장했습니다. 이 브라우저의 교육생 화면에 적용됩니다.'); }
    else flash('저장 실패 — 브라우저 저장소를 사용할 수 없습니다. 배포 링크를 사용하십시오.');
  }

  document.addEventListener('DOMContentLoaded', function () {
    FDL.charts.initTooltip();
    $('#saveBtn').onclick = save;
    var hasResults = FDL.store.get('fdl.results', []).length;
    if (location.hash === '#debrief' || (hasResults && !saved)) tab = location.hash === '#debrief' ? 'debrief' : tab;
    setDirty(false);
    render();
    window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  });
})();

</script>
</body>
</html>
