<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Decision Lab</title>
  <style>
/* ==========================================================================
   FACTORY DECISION LAB — Control Room Dashboard (dark industrial)
   ========================================================================== */
:root {
  color-scheme: dark;
  --bg: #0b0f14;
  --panel: #121820;
  --panel-2: #151b23;
  --panel-3: #1b232e;
  --line: #243040;
  --line-2: #2f3d50;
  --text: #dbe3ec;
  --text-2: #a4b1c0;
  --muted: #718096;
  --accent: #3a9bdc;
  --accent-2: #1f6fa8;
  --good: #0ca30c;
  --good-t: #4cc74c;
  --warn: #fab219;
  --serious: #ec835a;
  --crit: #d03b3b;
  --crit-t: #ff6b6b;
  --focus: #6cb6ff;
  --radius: 8px;
  --mono: "JetBrains Mono", "D2Coding", Consolas, "SFMono-Regular", Menlo, monospace;
  --sans: "Pretendard", "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* ---------- Buttons ---------- */
.btn { text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line-2); background: var(--panel-3); color: var(--text);
  padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: #223043; border-color: #3b4d63; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent-2); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #2780c0; }
.btn.danger { background: #5a1d1d; border-color: var(--crit); color: #fff; }
.btn.warn { background: #4d3808; border-color: var(--warn); color: #ffe3a3; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.btn.lg { padding: 12px 28px; font-size: 15px; letter-spacing: .04em; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; overflow: hidden; }
.topbar {
  display: flex; align-items: center; gap: 16px; padding: 8px 16px;
  background: #0e141b; border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .08em; font-size: 15px; white-space: nowrap; }
.brand .logo { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #1f6fa8, #0f3b5e); display: grid; place-items: center; font-size: 13px; }
.case-name { color: var(--text-2); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.case-name b { color: var(--text); font-weight: 600; }
.clockbox { display: flex; gap: 14px; align-items: center; }
.clock-item { text-align: right; }
.clock-item .lbl { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.clock-item .val { font-family: var(--mono); font-size: 20px; font-weight: 700; line-height: 1.1; }
.clock-item.remaining .val { color: #ffd479; }
.clock-item.remaining.low .val { color: var(--crit-t); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }

/* ---------- KPI bar ---------- */
.kpibar { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 8px 16px; background: #0d1218; border-bottom: 1px solid var(--line); }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 8px 12px; position: relative; overflow: hidden; min-width: 0;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--good); }
.kpi.warn::before { background: var(--warn); }
.kpi.crit::before { background: var(--crit); }
.kpi.crit { border-color: #6b2525; background: #1a1215; }
.kpi .k-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.kpi .k-name { font-size: 11px; color: var(--text-2); letter-spacing: .04em; white-space: nowrap; }
.kpi .k-flag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; display: none; white-space: nowrap; }
.kpi.warn .k-flag { display: inline-block; background: #3d2e08; color: var(--warn); }
.kpi.crit .k-flag { display: inline-block; background: #4a1414; color: #ff8a8a; }
.kpi .k-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 6px; }
.kpi .k-val { font-family: var(--mono); font-size: 24px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.kpi .k-val small { font-size: 13px; color: var(--text-2); margin-left: 2px; }
.kpi .k-delta { font-size: 12px; font-weight: 700; font-family: var(--mono); }
.kpi .k-delta.bad { color: var(--crit-t); }
.kpi .k-delta.good { color: var(--good-t); }
.kpi .spark { width: 90px; height: 26px; flex-shrink: 0; }
.kpi .spark path { fill: none; stroke-width: 1.5; }
.lvl { font-family: var(--mono); font-weight: 700; }
.lvl.LOW { color: var(--good-t); }
.lvl.MEDIUM { color: var(--warn); }
.lvl.HIGH { color: var(--serious); }
.lvl.CRITICAL { color: var(--crit-t); }

/* ---------- Main 3-col ---------- */
.main { display: grid; grid-template-columns: 172px minmax(0, 1fr) 380px; min-height: 0; }
.sidenav { background: #0e141b; border-right: 1px solid var(--line); padding: 10px 8px; overflow-y: auto; }
.sidenav .nav-title { font-size: 10px; color: var(--muted); letter-spacing: .12em; padding: 6px 10px; }
.sidenav button {
  display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0;
  padding: 9px 10px; border-radius: 6px; cursor: pointer; color: var(--text-2); text-align: left; font-weight: 500;
}
.sidenav button:hover { background: var(--panel-3); color: var(--text); }
.sidenav button.active { background: #17324a; color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.sidenav .ico { width: 18px; text-align: center; font-size: 15px; }
.sidenav .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

.content { overflow-y: auto; padding: 14px 16px 24px; min-width: 0; }
.view-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.view-head h2 { margin: 0; font-size: 17px; letter-spacing: .02em; }
.view-head .sub { color: var(--muted); font-size: 12px; }

.grid { display: grid; gap: 12px; }
.grid.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.card h3 { margin: 0 0 8px; font-size: 13px; color: var(--text-2); font-weight: 600; letter-spacing: .03em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card h3 .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 3px; background: var(--panel-3); color: var(--muted); }
.card .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.lock-card { text-align: center; padding: 26px 14px; color: var(--muted); border-style: dashed; }
.lock-card .l-ico { font-size: 22px; }

/* ---------- Charts ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart .grid, .chart .grid-poly { stroke: #223041; stroke-width: 1; fill: none; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--mono); }
.chart .axis.lbl { fill: var(--text-2); font-family: var(--sans); font-size: 12px; }
.chart .val { fill: var(--text); font-size: 11px; font-family: var(--mono); font-weight: 600; }
.chart .series { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ref { stroke: #5a6b80; stroke-dasharray: 4 4; }
.chart .marker { stroke: #8a6d1f; stroke-dasharray: 2 3; }
.chart .marker-label { fill: #d8b25a; font-size: 10px; }
.chart .live-zone { fill: #3a9bdc; opacity: .06; }
.chart .live-label { fill: var(--accent); font-weight: 700; }
.chart .ring { stroke: var(--panel); stroke-width: 2; }
.chart .hover-col { fill: transparent; cursor: crosshair; }
.chart .hover-col:hover { fill: rgba(255, 255, 255, .04); }
.chart .bar.muted { opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--text-2); margin-top: 6px; }
.legend i, #fdl-tip i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
#fdl-tip {
  position: fixed; z-index: 999; pointer-events: none; display: none;
  background: #0a0e13; border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px;
  font-size: 12px; line-height: 1.6; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); max-width: 280px;
}

/* ---------- Sub tabs ---------- */
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; overflow-x: auto; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--text-2); cursor: pointer; font-weight: 600; white-space: nowrap; }
.subtabs button:hover { color: var(--text); }
.subtabs button.active { color: #fff; border-bottom-color: var(--accent); }

/* ---------- Tables ---------- */
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .04em; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.data td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data td.num { font-family: var(--mono); text-align: right; white-space: nowrap; }
table.data th.num { text-align: right; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: #172130; }
table.data .hi { color: var(--crit-t); font-weight: 700; }
.table-wrap { overflow-x: auto; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 3px; font-family: var(--mono); white-space: nowrap; }
.badge.RUN { background: #0f2e14; color: var(--good-t); }
.badge.STOP { background: #3a1616; color: #ff8a8a; }
.badge.INSPECT, .badge.SETUP { background: #3a2c08; color: var(--warn); }
.badge.cat { background: var(--panel-3); color: var(--text-2); font-family: var(--sans); }

/* ---------- Factory map ---------- */
.fmap { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 2px 8px; }
.fnode {
  flex: 1 1 0; min-width: 118px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 10px 10px; cursor: pointer; text-align: left; transition: border-color .15s, background .15s; position: relative;
}
.fnode:hover { border-color: var(--accent); background: #16222f; }
.fnode.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.fnode .fn-step { font-size: 10px; color: var(--muted); letter-spacing: .1em; }
.fnode .fn-name { font-weight: 700; font-size: 13px; margin: 2px 0 6px; }
.fnode .fn-eq { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 6px; }
.fnode .fn-eq span { font-size: 10px; font-family: var(--mono); padding: 1px 4px; border-radius: 3px; background: #0f2e14; color: var(--good-t); }
.fnode .fn-eq span.STOP { background: #3a1616; color: #ff8a8a; }
.fnode .fn-eq span.INSPECT, .fnode .fn-eq span.SETUP { background: #3a2c08; color: var(--warn); }
.fnode .fn-metric { font-size: 11px; color: var(--text-2); display: flex; justify-content: space-between; font-family: var(--mono); }
.fnode .fn-alert { position: absolute; top: 8px; right: 8px; font-size: 10px; font-weight: 700; color: var(--warn); }
.farrow { display: grid; place-items: center; width: 22px; color: #4a5d75; flex-shrink: 0; font-size: 16px; }

/* ---------- Right panel ---------- */
.rightpanel { background: #0e141b; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.rp-tabs { display: flex; border-bottom: 1px solid var(--line); }
.rp-tabs button { flex: 1; background: none; border: 0; padding: 11px 8px; cursor: pointer; color: var(--text-2); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; }
.rp-tabs button.active { color: #fff; border-bottom-color: var(--accent); }
.rp-tabs .cnt { font-family: var(--mono); font-size: 11px; background: var(--panel-3); border-radius: 8px; padding: 0 6px; margin-left: 4px; }
.rp-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 94%; padding: 9px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
.msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
.msg.user { align-self: flex-end; background: #17324a; border: 1px solid #22486a; }
.msg.ai { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
.msg.ai .who { font-size: 10px; color: var(--accent); font-weight: 700; letter-spacing: .1em; margin-bottom: 4px; }
.msg .hint { color: #d8c07a; font-size: 12px; }
.msg .hi { color: var(--crit-t); font-weight: 700; }
.msg ul.tight { margin: 4px 0; padding-left: 18px; }
table.mini { border-collapse: collapse; font-size: 12px; margin: 6px 0; width: 100%; }
table.mini th, table.mini td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; }
table.mini th { color: var(--muted); font-weight: 600; }
.chat-input { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 12px; padding: 3px 9px; cursor: pointer; color: var(--text-2); }
.chip:hover { color: #fff; border-color: var(--accent); }
.chip.on { background: #17324a; border-color: var(--accent); color: #fff; }
.chat-input form { display: flex; gap: 6px; }
.chat-input input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; padding: 8px 10px; }
.typing { color: var(--muted); font-size: 12px; font-style: italic; }

/* Hypothesis */
.hyp-wrap { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.hyp { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.hyp.st-유력 { border-color: #7a5b12; }
.hyp.st-기각 { opacity: .6; }
.hyp .h-top { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.hyp .h-title { font-weight: 700; }
.hyp .h-meta { display: flex; gap: 6px; margin: 8px 0 6px; flex-wrap: wrap; }
.hyp select { background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 2px 6px; font-size: 12px; }
.hyp textarea { width: 100%; min-height: 44px; }
.hyp .h-x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
.like-HIGH { color: var(--crit-t); } .like-MEDIUM { color: var(--warn); } .like-LOW { color: var(--text-2); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label, .flabel { font-size: 12px; color: var(--text-2); font-weight: 600; }
input[type=text], input[type=number], textarea, select {
  background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 7px 9px; color: var(--text);
}
textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- Bottom bar ---------- */
.bottombar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #0e141b; border-top: 1px solid var(--line); }
.ticker { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); overflow: hidden; }
.ticker .t-time { font-family: var(--mono); color: var(--muted); }
.ticker .t-msg { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.decision-btn { background: linear-gradient(180deg, #d9822b, #b5621a); border: 1px solid #f0a050; color: #fff; font-weight: 800; letter-spacing: .14em; padding: 11px 34px; border-radius: 6px; cursor: pointer; font-size: 15px; }
.decision-btn:hover { filter: brightness(1.1); }
.panel-toggle { display: none; }

/* ---------- Drawer (process side panel) ---------- */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: #0f151c; border-left: 1px solid var(--line-2);
  transform: translateX(100%); transition: transform .22s ease; z-index: 50; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0, 0, 0, .45);
}
.drawer.open { transform: none; }
.drawer .d-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.drawer .d-head h3 { margin: 0; font-size: 16px; }
.drawer .d-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.kv .k { font-size: 11px; color: var(--muted); }
.kv .v { font-family: var(--mono); font-weight: 700; font-size: 15px; }
.sect-title { font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 4px 0 -4px; }
ul.plain { margin: 0; padding: 0; list-style: none; }
ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
ul.plain li .when { font-family: var(--mono); color: var(--muted); font-size: 12px; margin-right: 8px; }

/* ---------- Modals ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(3, 6, 10, .72); z-index: 80; display: grid; place-items: center; padding: 16px; }
.modal { background: #111820; border: 1px solid var(--line-2); border-radius: 10px; width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0, 0, 0, .6); }
.modal.wide { width: min(920px, 100%); }
.modal .m-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.modal .m-head h3 { margin: 0; font-size: 16px; letter-spacing: .02em; }
.modal .m-body { padding: 16px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal .m-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
.alert-modal { border-width: 2px; }
.alert-modal .m-head { background: #1d1410; }
.alert-modal.QUALITY { border-color: var(--crit); } .alert-modal.QUALITY .m-head h3 { color: #ff8a8a; }
.alert-modal.PRODUCTION { border-color: var(--warn); } .alert-modal.PRODUCTION .m-head h3 { color: var(--warn); }
.alert-modal.CUSTOMER { border-color: var(--serious); } .alert-modal.CUSTOMER .m-head h3 { color: var(--serious); }
.alert-modal.MATERIAL, .alert-modal.EQUIPMENT, .alert-modal.INFO { border-color: var(--accent); } .alert-modal.MATERIAL .m-head h3, .alert-modal.EQUIPMENT .m-head h3 { color: #8fcaf5; }
.alert-modal .m-head { animation: flash 1.2s ease 2; }
@keyframes flash { 50% { background: #3a1a12; } }
.alert-time { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.alert-body p { margin: 0 0 8px; font-size: 15px; line-height: 1.6; }
.action-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.action-item { display: flex; gap: 10px; padding: 9px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; align-items: flex-start; }
.action-item:hover { border-color: var(--line-2); }
.action-item.on { border-color: var(--accent); background: #14263a; }
.action-item input[type=checkbox] { margin-top: 3px; accent-color: var(--accent); }
.action-item .a-label { font-weight: 700; font-size: 13px; }
.action-item .a-desc { font-size: 11px; color: var(--muted); line-height: 1.4; }
.action-item select { margin-top: 6px; font-size: 12px; padding: 3px 6px; }
.group-title { font-size: 11px; color: var(--muted); letter-spacing: .1em; margin-top: 4px; }
.req { color: var(--crit-t); }
.diff-table td.arrow { color: var(--muted); text-align: center; }
.diff-table td.better { color: var(--good-t); font-weight: 700; }
.diff-table td.worse { color: var(--crit-t); font-weight: 700; }

/* ---------- Brief / Final / Result ---------- */

/* URL-safe base64 for Korean text */
FDL.encodeCfg = function (obj) {
  var s = JSON.stringify(obj);
  var b = btoa(unescape(encodeURIComponent(s)));
  return b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
};
FDL.decodeCfg = function (str) {
  var b = str.replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  return JSON.parse(decodeURIComponent(escape(atob(b))));
};

FDL.store = {
  get: function (k, fallback) {
    try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
  },
  set: function (k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
};

/* 게임에 적용할 설정: URL(#cfg=) > localStorage(강사 저장) > 기본값 */
FDL.loadConfig = function () {
  var cfg = FDL.clone(FDL.DEFAULT_CONFIG);
  var src = 'default';
  try {
    var m = location.hash.match(/cfg=([^&]+)/);
    if (m) { FDL.deepMerge(cfg, FDL.decodeCfg(m[1])); src = 'link'; }
    else {
      var saved = FDL.store.get('fdl.config', null);
      if (saved) { FDL.deepMerge(cfg, saved); src = 'instructor'; }
    }
  } catch (e) { console.warn('config load failed', e); }
  var sp = new URLSearchParams(location.search);
  if (sp.get('speed')) cfg.speed = Number(sp.get('speed')) || cfg.speed;
  cfg._source = src;
  return cfg;
};

FDL.escape = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};

/* ---------- 브라우저 대화상자 대체 (임베드 환경에서도 동작) ---------- */
FDL.dialog = function (o) {
  var bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.style.zIndex = 130;
  bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="m-head"><h3>' + FDL.escape(o.title || '확인') + '</h3></div>' +
    '<div class="m-body">' + (o.html || '<p style="margin:0;white-space:pre-wrap">' + FDL.escape(o.message || '') + '</p>') + '</div>' +
    '<div class="m-foot">' + (o.cancel === false ? '' : '<button class="btn" data-no>' + FDL.escape(o.cancel || '취소') + '</button>') +
    '<button class="btn primary" data-yes>' + FDL.escape(o.ok || '확인') + '</button></div></div>';
  document.body.appendChild(bg);
  var close = function () { bg.remove(); };
  var no = bg.querySelector('[data-no]');
  if (no) no.onclick = function () { close(); if (o.onNo) o.onNo(); };
  bg.querySelector('[data-yes]').onclick = function () { close(); if (o.onYes) o.onYes(); };
  bg.querySelector('[data-yes]').focus();
  if (o.onOpen) o.onOpen(bg, close);
  return close;
};
FDL.confirmBox = function (message, onYes, ok) { return FDL.dialog({ message: message, onYes: onYes, ok: ok }); };
FDL.alertBox = function (message) { return FDL.dialog({ title: '알림', message: message, cancel: false }); };

FDL.copyText = function (text, done) {
  var ok = function () { if (done) done(true); };
  var fail = function () { if (done) done(false); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail);
    else fail();
  } catch (e) { fail(); }
};

/* JSON 파일 저장. 다운로드가 막힌 환경(임베드 뷰어)에서는 복사용 창을 띄움 */
FDL.saveJson = function (obj, name) {
  var text = JSON.stringify(obj, null, 1);
  if (!window.FDL_EMBED) {
    try {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      return;
    } catch (e) { /* fall through */ }
  }
  FDL.dialog({
    title: 'JSON 복사 — ' + name, ok: '복사', cancel: '닫기',
    html: '<p class="muted" style="margin:0;font-size:13px">이 환경에서는 파일 다운로드가 제한됩니다. 아래 내용을 복사해 메모장에 붙여 넣고 <b>' + FDL.escape(name) + '</b> 로 저장하십시오.</p>' +
      '<textarea id="fdlJsonOut" readonly style="width:100%;min-height:220px;font-family:var(--mono);font-size:11px">' + FDL.escape(text) + '</textarea>',
    onYes: function () {},
    onOpen: function (bg) {
      var ta = bg.querySelector('#fdlJsonOut'), yes = bg.querySelector('[data-yes]');
      yes.onclick = function () {
        FDL.copyText(text, function (okd) {
          if (!okd) { ta.focus(); ta.select(); }
          yes.textContent = okd ? '복사됨 ✓' : '전체 선택됨 — Ctrl+C';
        });
      };
    }
  });
};

</script>
  <script>
/* ==========================================================================
   FACTORY DECISION LAB — Simulation Model (Hidden Variables + Consequence)
   모든 KPI/데이터는 Hidden Root Cause 설정과 현재 상태로부터 계산됩니다.
   ========================================================================== */
(function () {
  var EQ = FDL.EQUIPMENT;
  var EQ_OFFSET = { 'EQ-01': -0.1, 'EQ-02': 0.1, 'EQ-03': 0, 'EQ-04': 0.05 };
  var LANE = { 'EQ-01': 'MT-01', 'EQ-02': 'MT-01', 'EQ-03': 'MT-02', 'EQ-04': 'MT-02' };
  var OPERATOR = { day: { 'MT-01': '최OO (선임)', 'MT-02': '김OO (신규)' }, night: { 'MT-01': '한OO', 'MT-02': '정OO' } };
  var H_LOT = -19;          // 어제 14:00 Paste Lot 변경
  var H_PCB = -24;          // 어제 09:00 PCB Lot 변경
  var H_RECIPE = -10 - 1 / 3; // 어제 22:40 Changeover
  var UNITS_PER_EQ_HOUR = 275;

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function noise(seed, key) { return ((hash(seed + '|' + key) % 10000) / 10000) * 2 - 1; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function r1(v) { return Math.round(v * 10) / 10; }

  function Model(cfg) {
    this.cfg = cfg;
    this.seed = String(cfg.seed || 1);
    var eq = {};
    EQ.forEach(function (id) { eq[id] = { status: 'RUN', prev: 'RUN', until: null }; });
    this.s = {
      t: 0,
      lot: 'NEW',
      oldStock: null,
      eq: eq,
      recipeFixed: false,
      tcFixed: false,
      rate: 1,
      lineStopped: false,
      fullInspection: false,
      hold: false,
      overtime: false,
      commDone: false,
      commAt: null,
      exposure: cfg.kpi.customerExposure0,
      produced: 0,
      prodSum: 0,
      prodN: 0,
      lastDefect: null,
      tasks: [],
      unlocked: { pcn: false, line3: false, profile: {} },
      findings: []
    };
    this.history = [];
  }

  Model.prototype.clock = function (t) {
    var p = (this.cfg.startClock || '09:00').split(':');
    var m = Math.round(Number(p[0]) * 60 + Number(p[1]) + (t === undefined ? this.s.t : t));
    m = ((m % 1440) + 1440) % 1440;
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  };

  Model.prototype.shiftAt = function (h) {
    // h: 게임 시작(09:00) 기준 상대 시간(시간). 주간 08-20, 야간 20-08
    var hod = ((9 + h) % 24 + 24) % 24;
    return (hod >= 8 && hod < 20) ? 'day' : 'night';
  };

  /* 과거 시점(h, 시간 단위) 설비별 불량률 */
  Model.prototype.historicDefect = function (id, h) {
    var c = this.cfg, rc = c.rootCause, ef = c.effects;
    var lotNew = h >= H_LOT;
    var d = ef.base + EQ_OFFSET[id];
    if (rc.material && lotNew) d += ef.lotEffect;
    if (rc.eqId === id) {
      if (rc.recipeError && h >= H_RECIPE) {
        d += ef.recipeEffect;
        if (rc.material && lotNew) d += ef.interaction;
      }
      if (rc.tcDrift) d += ef.tcDrift * clamp((h + 48) / 48, 0, 1);
    }
    d *= 1 + noise(this.seed, id + '@' + Math.round(h * 12)) * 0.07;
    return Math.max(0.4, d);
  };

  /* 현재 상태 기준 설비별 불량률 */
  Model.prototype.liveDefect = function (id, t) {
    var c = this.cfg, rc = c.rootCause, ef = c.effects, s = this.s;
    t = t === undefined ? s.t : t;
    var lotNew = s.lot === 'NEW';
    var d = ef.base + EQ_OFFSET[id];
    if (rc.material && lotNew) d += ef.lotEffect;
    if (rc.eqId === id) {
      if (rc.recipeError && !s.recipeFixed) {
        d += ef.recipeEffect;
        if (rc.material && lotNew) {
          var relief = s.rate < 1 ? FDL.actionParam(c, 'reduce', 'interactionRelief') : 0;
          d += ef.interaction * (1 - relief);
        }
      }
      if (rc.tcDrift && !s.tcFixed) d += ef.tcDrift + Math.min(ef.tcDriftRamp * t, 6);
    }
    d *= 1 + noise(this.seed, id + '#' + Math.floor(t / 3)) * 0.04;
    return Math.max(0.4, d);
  };

  Model.prototype.running = function () {
    var s = this.s;
    if (s.lineStopped) return [];
    return EQ.filter(function (id) { return s.eq[id].status === 'RUN'; });
  };

  Model.prototype.level = function (kind, v) {
    if (kind === 'delivery') return v >= 1.03 ? 'LOW' : v >= 0.97 ? 'MEDIUM' : v >= 0.86 ? 'HIGH' : 'CRITICAL';
    return v < 1.2 ? 'LOW' : v < 2.5 ? 'MEDIUM' : v < 4 ? 'HIGH' : 'CRITICAL';
  };

  /* KPI 스냅샷 */
  Model.prototype.snapshot = function () {
    var c = this.cfg, s = this.s, self = this;
    var run = this.running();
    var perEq = {};
    EQ.forEach(function (id) { perEq[id] = { status: s.lineStopped ? 'STOP' : s.eq[id].status, defect: self.liveDefect(id) }; });
    var defect;
    if (run.length) {
      defect = run.reduce(function (a, id) { return a + perEq[id].defect; }, 0) / run.length;
      s.lastDefect = defect;
    } else {
      defect = s.lastDefect == null ? c.effects.base : s.lastDefect;
    }
    var share = run.length / EQ.length;
    if (run.length > 0 && run.length < EQ.length) share = Math.min(1, share * (1 + FDL.actionParam(c, 'stop_eq', 'shiftGain')));
    var prod = 0;
    if (run.length) {
      prod = c.kpi.baseCapacity * share * s.rate * (s.fullInspection ? FDL.actionParam(c, 'full_inspection', 'productionFactor') : 1);
      prod -= Math.max(0, defect - c.effects.base);
      prod = Math.max(0, prod);
    }
    var util = run.length ? c.kpi.baseUtil * (run.length / EQ.length) * (s.rate < 1 ? 0.93 : 1) : 0;

    // 납기 예측
    var remainH = Math.max(0, 9 - s.t / 60);
    var fg = c.kpi.fgStock * (s.hold ? 0.5 : 1);
    var projected = fg + s.produced + remainH * c.kpi.planPerHour * prod / 100 + (s.overtime ? FDL.actionParam(c, 'overtime', 'deliveryBonus') / 100 * c.kpi.shipmentTarget : 0);
    var ratio = projected / c.kpi.shipmentTarget + (c.kpi.deliveryBias || 0) / 100;

    return {
      t: s.t, clock: this.clock(),
      defect: defect, yield: 100 - defect, production: prod, util: util,
      projected: projected, deliveryRatio: ratio, delivery: this.level('delivery', ratio),
      exposure: s.exposure, customer: this.level('customer', s.exposure),
      perEq: perEq, running: run.length, lot: s.lot
    };
  };

  /* 1 게임 분 진행 */
  Model.prototype.step = function (dt) {
    var c = this.cfg, s = this.s;
    var snap = this.snapshot();
    // 누적 생산
    s.produced += c.kpi.planPerHour * snap.production / 100 * dt / 60;
    s.prodSum += snap.production * dt; s.prodN += dt;
    // 고객 노출도 (유출)
    if (snap.running > 0) {
      var esc = s.fullInspection ? FDL.actionParam(c, 'full_inspection', 'escapeRate') : 0.10;
      s.exposure += snap.defect / 100 * esc * 12 * (s.hold ? 0.3 : 1) * dt;
    }
    // 대체 Lot 소모
    if (s.lot === 'OLD' && s.oldStock != null && snap.running > 0) {
      s.oldStock -= dt * (snap.running / EQ.length) * s.rate;
    }
    s.t += dt;
  };

  Model.prototype.record = function () {
    var snap = this.snapshot();
    var rec = {
      t: Math.round(snap.t), clock: snap.clock,
      defect: r1(snap.defect), yield: r1(snap.yield), production: r1(snap.production), util: r1(snap.util),
      delivery: snap.delivery, customer: snap.customer, ratio: Math.round(snap.deliveryRatio * 1000) / 1000,
      exposure: Math.round(snap.exposure * 100) / 100, perEq: {},
      lot: this.s.lot === 'NEW' ? 'SP-0925B' : 'SP-0911A'
    };
    Object.keys(snap.perEq).forEach(function (id) { rec.perEq[id] = { s: snap.perEq[id].status, d: r1(snap.perEq[id].defect) }; });
    this.history.push(rec);
    return rec;
  };

  /* ---------------- 조치 적용 (Consequence) ---------------- */
  Model.prototype.apply = function (actionId, target) {
    var c = this.cfg, s = this.s, notes = [];
    var P = function (k) { return FDL.actionParam(c, actionId, k); };
    switch (actionId) {
      case 'continue':
        notes.push('현 생산조건 유지'); break;
      case 'reduce':
        s.rate = P('rate'); notes.push('라인 속도 ' + Math.round(s.rate * 100) + '%로 조정'); break;
      case 'stop_eq':
        if (target && s.eq[target]) { s.eq[target].status = 'STOP'; notes.push(target + ' 정지, 물량 타 설비 분산'); }
        break;
      case 'restart_eq':
        if (target && s.eq[target] && s.eq[target].status === 'STOP') { s.eq[target].status = 'RUN'; notes.push(target + ' 재가동'); }
        break;
      case 'stop_all':
        s.lineStopped = true; notes.push('라인 전체 생산 중단'); break;
      case 'resume_all':
        s.lineStopped = false; notes.push('라인 생산 재개'); break;
      case 'quarantine_lot':
        if (s.lot === 'NEW' && (s.oldStock == null || s.oldStock > 0)) {
          s.lot = 'OLD';
          if (s.oldStock == null) s.oldStock = P('stockMin');
          s.produced = Math.max(0, s.produced - P('wipLoss') / 100 * c.kpi.planPerHour);
          notes.push('SP-0925B 격리 → SP-0911A 투입 (재고 약 ' + Math.round(s.oldStock) + '분)');
        } else notes.push('대체 Lot 재고 없음 — 격리 불가');
        break;
      case 'full_inspection':
        s.fullInspection = true; notes.push('최종검사 전수검사 전환'); break;
      case 'hold_shipment':
        if (!s.hold) { s.hold = true; s.exposure *= (1 - P('exposureCut')); }
        notes.push('어제 14:00 이후 생산분 출하 보류'); break;
      case 'customer_comm':
        if (!s.commDone) { s.commDone = true; s.commAt = s.t; s.exposure = Math.max(0.3, s.exposure - P('exposureRelief')); }
        notes.push('고객 품질팀 선제 공유'); break;
      case 'overtime':
        s.overtime = true; notes.push('잔업·특근 편성'); break;
      case 'eq_inspection':
        if (target && s.eq[target]) {
          var e = s.eq[target];
          if (e.status !== 'INSPECT') { e.prev = e.status === 'STOP' ? 'STOP' : 'RUN'; e.status = 'INSPECT'; }
          s.tasks.push({ type: 'inspection', eq: target, doneAt: s.t + P('durationMin') });
          notes.push(target + ' 긴급점검 착수 (약 ' + P('durationMin') + '분 소요)');
        }
        break;
      case 'recipe_reset':
        if (target && s.eq[target]) {
          var e2 = s.eq[target];
          if (e2.status === 'RUN' || e2.status === 'STOP') { e2.prev = e2.status; e2.status = 'SETUP'; }
          s.tasks.push({ type: 'recipe', eq: target, doneAt: s.t + P('durationMin') });
          notes.push(target + ' 레시피 재로드 (약 ' + P('durationMin') + '분 소요)');
        }
        break;
      case 'supplier_inquiry':
        if (!s.tasks.some(function (x) { return x.type === 'supplier'; }) && !s.unlocked.pcn) {
          s.tasks.push({ type: 'supplier', doneAt: s.t + P('replyMin') });
        }
        notes.push('공급사 회신 대기 (약 ' + P('replyMin') + '분)'); break;
    }
    return notes;
  };

  /* 진행 중 작업 완료 처리 → 결과 이벤트 반환 */
  Model.prototype.processTasks = function () {
    var s = this.s, rc = this.cfg.rootCause, out = [], self = this;
    var remain = [];
    s.tasks.forEach(function (task) {
      if (task.doneAt > s.t) { remain.push(task); return; }
      if (task.type === 'inspection') {
        var e = s.eq[task.eq];
        e.status = s.tasks.some(function (x) { return x !== task && x.eq === task.eq && x.doneAt > s.t; }) ? e.status : e.prev;
        s.unlocked.profile[task.eq] = true;
        var lines = [];
        if (rc.eqId === task.eq && rc.tcDrift && !s.tcFixed) {
          s.tcFixed = true;
          lines.push('Profiler 실측: Zone 6 실제 온도가 설정 대비 +7°C 높게 측정됨 (제어 열전대 편차) → 열전대 교체·교정 완료');
        } else {
          lines.push('Profiler 실측: 존별 실측 온도 설정 대비 ±1°C 이내 (정상)');
        }
        if (rc.eqId === task.eq && rc.recipeError && !s.recipeFixed) {
          lines.push('로드된 레시피: PM220_RF_Rev.C (타 설비는 Rev.D). Soak 구간 설정이 타 설비 대비 5°C 낮음');
          lines.push('※ 점검팀은 레시피를 임의 변경하지 않았습니다. 레시피 재설정 여부는 책임자 판단이 필요합니다.');
        } else {
          lines.push('로드된 레시피: PM220_RF_Rev.D (표준과 일치)');
        }
        lines.push('컨베이어 속도·N2 농도·Fan 회전수 정상');
        s.findings.push({ t: s.t, eq: task.eq, lines: lines });
        out.push({ id: 'inspection_done_' + task.eq, type: 'EQUIPMENT', title: 'EQUIPMENT REPORT — ' + task.eq + ' 긴급점검 결과', lines: lines });
      } else if (task.type === 'recipe') {
        var e3 = s.eq[task.eq];
        e3.status = e3.prev === 'STOP' ? 'STOP' : 'RUN';
        var fixed = rc.eqId === task.eq && rc.recipeError && !s.recipeFixed;
        if (fixed) s.recipeFixed = true;
        out.push({ id: 'recipe_done_' + task.eq, type: 'EQUIPMENT', title: 'EQUIPMENT — ' + task.eq + ' 레시피 재로드 완료',
          lines: [fixed ? '레시피 PM220_RF_Rev.C → Rev.D 로 변경 로드되었습니다.' : '기존과 동일한 Rev.D 레시피가 재로드되었습니다. (변경 사항 없음)', task.eq + ' 가동 상태로 복귀했습니다.'] });
      } else if (task.type === 'supplier') {
        s.unlocked.pcn = true;
        var lines2 = rc.material ? [
          '공급사 회신: SP-0925B 는 활성제(Flux) 배합 변경 Lot 입니다. (PCN-0917, 9/17 통보)',
          '점도 204 Pa·s 로 규격(160~210) 상한에 근접한 Lot 이며, 변경 배합은 Soak 구간 +5°C 권장 Profile 필요.',
          '대체 Lot SP-0927C (점도 185) 는 내일 06:00 입고 가능합니다.'
        ] : [
          '공급사 회신: SP-0925B 는 PCN-0917(활성제 배합 변경) 적용 Lot 이며 출하검사 전 항목 합격입니다.',
          '동일 Lot 을 사용하는 타 고객사 이상 보고는 없습니다. 권장 Profile 은 Soak +5°C (귀사 Rev.D 반영 완료).',
          '대체 Lot 이 필요하면 내일 06:00 입고 가능합니다.'
        ];
        out.push({ id: 'supplier_reply', type: 'MATERIAL', title: 'MATERIAL — 공급사 회신 도착', lines: lines2 });
      }
    });
    s.tasks = remain;
    // 대체 Lot 소진
    if (s.lot === 'OLD' && s.oldStock != null && s.oldStock <= 0) {
      s.lot = 'NEW';
      out.push({ id: 'stock_out', type: 'MATERIAL', title: 'MATERIAL ALERT — 대체 Lot 소진',
        lines: ['SP-0911A 재고가 소진되었습니다.', '생산 유지를 위해 라인에 SP-0925B 가 다시 투입되었습니다. 추가 판단이 필요합니다.'] });
    }
    return out;
  };

  /* ---------------- 데이터 생성 (탐색용) ---------------- */
  Model.prototype.trend7d = function () {
    var self = this, out = [];
    for (var d = 6; d >= 2; d--) {
      out.push({ label: 'D-' + d, value: r1(this.cfg.effects.base + 0.05 * (6 - d) * 0.3 + noise(this.seed, 'day' + d) * 0.12) });
    }
    // 어제: 00~24시 평균
    var sum = 0, n = 0;
    for (var h = -33; h < -9; h += 0.5) { EQ.forEach(function (id) { sum += self.historicDefect(id, h); n++; }); }
    out.push({ label: 'D-1 (어제)', value: r1(sum / n) });
    out.push({ label: '오늘', value: r1(this.snapshot().defect), live: true });
    return out;
  };

  Model.prototype.hourly = function () {
    var self = this, labels = [], series = {}, overall = [];
    EQ.forEach(function (id) { series[id] = []; });
    for (var h = -24; h < 0; h++) {
      labels.push(this.clock(h * 60));
      var sum = 0;
      EQ.forEach(function (id) {
        var v = 0; for (var k = 0; k < 4; k++) v += self.historicDefect(id, h + k / 4); v /= 4;
        series[id].push(r1(v)); sum += v;
      });
      overall.push(r1(sum / EQ.length));
    }
    // 게임 진행분 (5분 단위)
    for (var i = 0; i < this.history.length; i += 5) {
      var rec = this.history[i];
      labels.push(rec.clock);
      EQ.forEach(function (id) { series[id].push(rec.perEq[id].s === 'RUN' ? rec.perEq[id].d : null); });
      overall.push(rec.defect);
    }
    return { labels: labels, series: series, overall: overall, liveFrom: 24 };
  };

  Model.prototype.pareto = function () {
    var base = this.cfg.effects.base;
    var now = this.snapshot().defect;
    var baseMix = [['부품 틀어짐', 0.30], ['미납 (Insufficient)', 0.24], ['Solder Bridge', 0.16], ['Void', 0.12], ['Tombstone', 0.10], ['기타', 0.08]];
    var excessMix = { 'Solder Bridge': 0.52, 'Void': 0.38, '미납 (Insufficient)': 0.10 };
    var ex = Math.max(0, now - base);
    return baseMix.map(function (m) {
      var today = base * m[1] + ex * (excessMix[m[0]] || 0);
      return { label: m[0], baseline: Math.round(base * m[1] * 100) / 100, today: Math.round(today * 100) / 100 };
    }).sort(function (a, b) { return b.today - a.today; });
  };

  /* 표본 생성: 과거(시간 단위) + 게임 진행(분 단위) */
  Model.prototype.samples = function (period) {
    var self = this, out = [];
    var from = period === '24h' ? -24 : period === 'today' ? -1 : -48;
    for (var h = from; h < 0; h += 0.5) {
      var shift = this.shiftAt(h);
      EQ.forEach(function (id) {
        out.push({
          eq: id, h: h, d: self.historicDefect(id, h), n: UNITS_PER_EQ_HOUR / 2,
          lot: h >= H_LOT ? 'SP-0925B' : 'SP-0911A', pcb: h >= H_PCB ? 'PCB-0920' : 'PCB-0913',
          shift: shift, lane: LANE[id], op: OPERATOR[shift][LANE[id]],
          hod: self.clock(Math.floor(h) * 60).slice(0, 2) + '시'
        });
      });
    }
    this.history.forEach(function (rec) {
      EQ.forEach(function (id) {
        if (rec.perEq[id].s !== 'RUN') return;
        out.push({
          eq: id, h: rec.t / 60, d: rec.perEq[id].d, n: UNITS_PER_EQ_HOUR / 60,
          lot: rec.lot || 'SP-0925B', pcb: 'PCB-0920', shift: 'day', lane: LANE[id], op: OPERATOR.day[LANE[id]],
          hod: rec.clock.slice(0, 2) + '시'
        });
      });
    });
    return out;
  };

  FDL.STRAT_DIMS = {
    eq: { label: 'Reflow 설비', key: 'eq' },
    lot: { label: 'Solder Paste Lot', key: 'lot' },
    shift: { label: '작업조 (주간/야간)', key: 'shiftLabel' },
    pcb: { label: 'PCB Lot', key: 'pcb' },
    lane: { label: '실장 Lane (Mounter)', key: 'lane' },
    op: { label: '실장 작업자', key: 'op' },
    hod: { label: '시간대', key: 'hod' }
  };

  Model.prototype.groupKey = function (smp, dim) {
    if (dim === 'shift') {
      var h = smp.h;
      if (h >= -1) return '주간조 (오늘)';
      if (h >= -13) return '야간조 (어젯밤)';
      if (h >= -25) return '주간조 (어제)';
      if (h >= -37) return '야간조 (그젯밤)';
      return '주간조 (그제)';
    }
    return smp[FDL.STRAT_DIMS[dim].key];
  };

  Model.prototype.strat = function (dim, period) {
    var self = this, g = {};
    this.samples(period).forEach(function (smp) {
      var k = self.groupKey(smp, dim);
      if (!g[k]) g[k] = { label: k, def: 0, n: 0, first: smp.h };
      g[k].def += smp.d / 100 * smp.n; g[k].n += smp.n;
      g[k].first = Math.min(g[k].first, smp.h);
    });
    var rows = Object.keys(g).map(function (k) { return { label: k, defect: r1(g[k].def / g[k].n * 100), units: Math.round(g[k].n), first: g[k].first }; });
    if (dim === 'hod' || dim === 'shift') rows.sort(function (a, b) { return a.first - b.first; });
    else rows.sort(function (a, b) { return a.label < b.label ? -1 : 1; });
    return rows;
  };

  Model.prototype.cross = function (dimA, dimB, period) {
    var self = this, cells = {}, rowsK = {}, colsK = {};
    this.samples(period).forEach(function (smp) {
      var a = self.groupKey(smp, dimA), b = self.groupKey(smp, dimB);
      rowsK[a] = Math.min(rowsK[a] === undefined ? 99 : rowsK[a], smp.h);
      colsK[b] = Math.min(colsK[b] === undefined ? 99 : colsK[b], smp.h);
      var k = a + '||' + b;
      if (!cells[k]) cells[k] = { def: 0, n: 0 };
      cells[k].def += smp.d / 100 * smp.n; cells[k].n += smp.n;
    });
    function order(obj, dim) {
      var ks = Object.keys(obj);
      if (dim === 'hod' || dim === 'shift') return ks.sort(function (x, y) { return obj[x] - obj[y]; });
      return ks.sort();
    }
    var rows = order(rowsK, dimA), cols = order(colsK, dimB);
    var m = rows.map(function (r) {
      return cols.map(function (cName) {
        var cell = cells[r + '||' + cName];
        return cell ? { v: r1(cell.def / cell.n * 100), n: Math.round(cell.n) } : null;
      });
    });
    return { rows: rows, cols: cols, m: m };
  };

  Model.prototype.recipeOf = function (id) {
    var rc = this.cfg.rootCause;
    return (rc.eqId === id && rc.recipeError && !this.s.recipeFixed) ? 'Rev.C' : 'Rev.D';
  };

  Model.prototype.zoneTable = function (id) {
    var rev = this.recipeOf(id);
    var sp = rev === 'Rev.D' ? [120, 150, 170, 180, 215, 245, 235, 180] : [120, 150, 165, 175, 215, 240, 235, 180];
    var rc = this.cfg.rootCause, s = this.s, self = this;
    var drift = rc.eqId === id && rc.tcDrift && !s.tcFixed;
    return sp.map(function (v, i) {
      var pv = v + Math.round(noise(self.seed, id + 'z' + i) * 10) / 10;
      var out = 55 + Math.round((noise(self.seed, id + 'o' + i) + 1) * 8);
      if (drift && i === 5) out = 91 + Math.round(Math.min(s.t / 10, 3));
      return { zone: 'Z' + (i + 1), sv: v, pv: r1(pv), out: out };
    });
  };

  Model.prototype.alarms = function (id) {
    var rc = this.cfg.rootCause, list = [];
    if (rc.eqId === id && rc.tcDrift) {
      list.push({ time: '어제 23:52', code: 'W-216', msg: 'Zone 6 Heater 출력 90% 초과 (Warning) — 작업자 Reset' });
      list.push({ time: '오늘 04:17', code: 'W-216', msg: 'Zone 6 Heater 출력 90% 초과 (Warning) — 작업자 Reset' });
      if (!this.s.tcFixed) list.push({ time: '오늘 08:41', code: 'W-216', msg: 'Zone 6 Heater 출력 92% (Warning)' });
    }
    if (id === 'EQ-01') list.push({ time: '어제 15:05', code: 'I-102', msg: '컨베이어 폭 자동조정 완료 (Info)' });
    if (id === 'EQ-04') list.push({ time: '그제 11:30', code: 'W-310', msg: 'N2 농도 일시 상승 1,050ppm (Warning) — 자동 복귀' });
    if (id === 'EQ-02') list.push({ time: '오늘 06:12', code: 'I-120', msg: '냉각 Fan 정기 점검 알림 (Info)' });
    return list;
  };

  Model.prototype.changeoverEq = function () { return this.cfg.rootCause.eqId || 'EQ-02'; };

  FDL.Model = Model;
  FDL.util = { r1: r1, clamp: clamp, noise: noise };
})();

  <script>
/* ==========================================================================
   FACTORY DECISION LAB — Lightweight SVG charts (no external dependency)
   ========================================================================== */
(function () {
  var esc = function (s) { return FDL.escape(s); };
  FDL.SERIES = ['#3987e5', '#d95926', '#199e70', '#c98500']; // validated on dark surface
  FDL.STATUS = { good: '#0ca30c', warning: '#fab219', serious: '#ec835a', critical: '#d03b3b' };

  function niceMax(v) {
    if (v <= 0) return 1;
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var n = v / p;
    var m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * p;
  }

  /* Line chart with crosshair tooltip */
  function line(o) {
    var W = o.width || 760, H = o.height || 240, L = 40, R = 16, T = 14, B = 30;
    var n = o.labels.length;
    var all = [];
    o.series.forEach(function (s) { s.values.forEach(function (v) { if (v != null) all.push(v); }); });
    var yMax = o.yMax != null ? o.yMax : niceMax(Math.max.apply(null, all.concat([1])) * 1.1);
    var yMin = o.yMin || 0;
    var x = function (i) { return L + (n <= 1 ? 0 : i * (W - L - R) / (n - 1)); };
    var y = function (v) { return T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin)); };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title || 'line chart') + '">';
    // grid
    for (var g = 0; g <= 4; g++) {
      var gv = yMin + (yMax - yMin) * g / 4;
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '"/>';
      svg += '<text class="axis" x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" text-anchor="end">' + (Math.round(gv * 10) / 10) + '</text>';
    }
    if (o.liveFrom != null && o.liveFrom < n) {
      svg += '<rect class="live-zone" x="' + x(o.liveFrom) + '" y="' + T + '" width="' + (W - R - x(o.liveFrom)) + '" height="' + (H - T - B) + '"/>';
      svg += '<text class="axis live-label" x="' + (x(o.liveFrom) + 4) + '" y="' + (T + 11) + '">LIVE</text>';
    }
    (o.refLines || []).forEach(function (r) {
      svg += '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(r.value) + '" y2="' + y(r.value) + '"/>';
      svg += '<text class="axis" x="' + (W - R) + '" y="' + (y(r.value) - 4) + '" text-anchor="end">' + esc(r.label) + '</text>';
    });
    // x labels
    var step = Math.max(1, Math.ceil(n / (o.maxXLabels || 8)));
    o.labels.forEach(function (lb, i) {
      if (i % step === 0 || (i === n - 1 && (n - 1) % step >= step / 2)) svg += '<text class="axis" x="' + x(i) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(lb) + '</text>';
    });
    (o.markers || []).forEach(function (mk) {
      svg += '<line class="marker" x1="' + x(mk.index) + '" x2="' + x(mk.index) + '" y1="' + T + '" y2="' + (H - B) + '"/>';
      svg += '<text class="axis marker-label" x="' + (x(mk.index) + 3) + '" y="' + (H - B - 4) + '">' + esc(mk.label) + '</text>';
    });
    o.series.forEach(function (s) {
      var d = '', pen = false;
      s.values.forEach(function (v, i) {
        if (v == null) { pen = false; return; }
        d += (pen ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
        pen = true;
      });
      svg += '<path class="series" d="' + d + '" stroke="' + s.color + '"' + (s.dash ? ' stroke-dasharray="5 4"' : '') + (s.width ? ' stroke-width="' + s.width + '"' : '') + '/>';
      // end label
      for (var k = s.values.length - 1; k >= 0; k--) {
        if (s.values[k] != null) {
          svg += '<circle cx="' + x(k) + '" cy="' + y(s.values[k]) + '" r="4" fill="' + s.color + '" class="ring"/>';
          break;
        }
      }
    });
    // hover columns
    var colW = n > 1 ? (W - L - R) / (n - 1) : W;
    o.labels.forEach(function (lb, i) {
      var tip = '<b>' + esc(lb) + '</b>';
      o.series.forEach(function (s) {
        if (s.values[i] != null) tip += '<br><i style="background:' + s.color + '"></i>' + esc(s.name) + ' <b>' + s.values[i] + (o.unit || '') + '</b>';
      });
      svg += '<rect class="hover-col" x="' + (x(i) - colW / 2) + '" y="' + T + '" width="' + colW + '" height="' + (H - T - B) + '" data-tip="' + esc(tip) + '" data-x="' + x(i) + '"/>';
    });
    svg += '</svg>';
    if (o.series.length > 1) {
      svg += '<div class="legend">' + o.series.map(function (s) {
        return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>';
      }).join('') + '</div>';
    }
    return svg;
  }

  /* Vertical bar chart (single series) */
  function bars(o) {
    var W = o.width || 760, H = o.height || 220, L = 40, R = 12, T = 18, B = 30;
    var n = o.items.length;
    var max = o.max || niceMax(Math.max.apply(null, o.items.map(function (i) { return i.value; }).concat([1])) * 1.15);
    var bw = Math.min(56, (W - L - R) / n - 10);
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title || 'bar chart') + '">';
    for (var g = 0; g <= 4; g++) {
      var gv = max * g / 4;
      svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(gv) + '" y2="' + y(gv) + '"/>';
      svg += '<text class="axis" x="' + (L - 6) + '" y="' + (y(gv) + 4) + '" text-anchor="end">' + (Math.round(gv * 10) / 10) + '</text>';
    }
    (o.refLines || []).forEach(function (r) {
      svg += '<line class="ref" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(r.value) + '" y2="' + y(r.value) + '"/>';
      svg += '<text class="axis" x="' + (W - R) + '" y="' + (y(r.value) - 4) + '" text-anchor="end">' + esc(r.label) + '</text>';
    });
    o.items.forEach(function (it, i) {
      var cx = L + (i + 0.5) * (W - L - R) / n;
      var top = y(it.value), h = Math.max(1, H - B - top);
      var r = Math.min(4, h / 2);
      var xL = cx - bw / 2;
      var path = 'M' + xL + ' ' + (H - B) + ' V' + (top + r) + ' Q' + xL + ' ' + top + ' ' + (xL + r) + ' ' + top +
        ' H' + (xL + bw - r) + ' Q' + (xL + bw) + ' ' + top + ' ' + (xL + bw) + ' ' + (top + r) + ' V' + (H - B) + ' Z';
      svg += '<path d="' + path + '" fill="' + (it.color || FDL.SERIES[0]) + '" class="bar' + (it.muted ? ' muted' : '') + '"/>';
      if (o.showValues !== false) svg += '<text class="val" x="' + cx + '" y="' + (top - 5) + '" text-anchor="middle">' + it.value + (o.unit || '') + '</text>';
      svg += '<text class="axis" x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(it.label) + '</text>';
      svg += '<rect class="hover-col" x="' + (cx - bw / 2 - 4) + '" y="' + T + '" width="' + (bw + 8) + '" height="' + (H - T - B) + '" data-tip="' + esc('<b>' + esc(it.label) + '</b><br>' + it.value + (o.unit || '') + (it.sub ? '<br>' + esc(it.sub) : '')) + '"/>';
    });
    return svg + '</svg>';
  }

  /* Paired horizontal bars (baseline vs today) */
  function pairedH(o) {
    var W = o.width || 760, rowH = 34, L = 150, R = 60, T = 8;
    var H = T + o.items.length * rowH + 8;
    var max = niceMax(Math.max.apply(null, o.items.map(function (i) { return Math.max(i.a, i.b); })) * 1.1);
    var xw = function (v) { return (W - L - R) * v / max; };
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.title || '') + '">';
    o.items.forEach(function (it, i) {
      var y0 = T + i * rowH;
      svg += '<text class="axis lbl" x="' + (L - 8) + '" y="' + (y0 + 18) + '" text-anchor="end">' + esc(it.label) + '</text>';
      svg += '<rect x="' + L + '" y="' + (y0 + 4) + '" width="' + Math.max(2, xw(it.a)) + '" height="10" rx="3" fill="' + o.colorA + '"/>';
      svg += '<rect x="' + L + '" y="' + (y0 + 16) + '" width="' + Math.max(2, xw(it.b)) + '" height="10" rx="3" fill="' + o.colorB + '"/>';
      svg += '<text class="val" x="' + (L + xw(it.b) + 6) + '" y="' + (y0 + 25) + '">' + it.b + (o.unit || '') + '</text>';
      svg += '<rect class="hover-col" x="0" y="' + y0 + '" width="' + W + '" height="' + rowH + '" data-tip="' + esc('<b>' + esc(it.label) + '</b><br>' + o.nameA + ': ' + it.a + (o.unit || '') + '<br>' + o.nameB + ': ' + it.b + (o.unit || '')) + '"/>';
    });
    svg += '</svg><div class="legend"><span><i style="background:' + o.colorA + '"></i>' + esc(o.nameA) + '</span><span><i style="background:' + o.colorB + '"></i>' + esc(o.nameB) + '</span></div>';
    return svg;
  }

  function sparkline(values, color) {
    var W = 90, H = 26;
    var v = values.filter(function (x) { return x != null; });
    if (v.length < 2) return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '"></svg>';
    var mn = Math.min.apply(null, v), mx = Math.max.apply(null, v);
    if (mx - mn < 0.5) { mx += 0.25; mn -= 0.25; }
    var d = v.map(function (val, i) {
      return (i ? 'L' : 'M') + (i * W / (v.length - 1)).toFixed(1) + ' ' + (H - 3 - (val - mn) / (mx - mn) * (H - 6)).toFixed(1);
    }).join(' ');
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"><path d="' + d + '" stroke="' + color + '"/></svg>';
  }

  /* Radar (0-100) */
  function radar(o) {
    var S = o.size || 360, cx = S / 2, cy = S / 2 + 6, Rr = S / 2 - 60, PAD = 70;
    var n = o.axes.length;
    var pt = function (i, v) {
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * Rr * v / 100, cy + Math.sin(a) * Rr * v / 100];
    };
    var svg = '<svg class="chart radar" viewBox="' + (-PAD) + ' 0 ' + (S + PAD * 2) + ' ' + (S + 10) + '" role="img" aria-label="역량 레이더">';
    [25, 50, 75, 100].forEach(function (lv) {
      svg += '<polygon class="grid-poly" points="' + o.axes.map(function (_, i) { return pt(i, lv).join(','); }).join(' ') + '"/>';
    });
    o.axes.forEach(function (ax, i) {
      var p = pt(i, 100), pl = pt(i, 122);
      svg += '<line class="grid" x1="' + cx + '" y1="' + cy + '" x2="' + p[0] + '" y2="' + p[1] + '"/>';
      var anchor = Math.abs(pl[0] - cx) < 10 ? 'middle' : pl[0] > cx ? 'start' : 'end';
      svg += '<text class="axis lbl" x="' + pl[0] + '" y="' + (pl[1] + 4) + '" text-anchor="' + anchor + '">' + esc(ax) + '</text>';
    });
    o.series.forEach(function (s) {
      var pts = s.values.map(function (v, i) { return pt(i, v).join(','); }).join(' ');
      svg += '<polygon points="' + pts + '" fill="' + s.color + '" fill-opacity="0.18" stroke="' + s.color + '" stroke-width="2"/>';
      s.values.forEach(function (v, i) {
        var p = pt(i, v);
        svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + s.color + '" class="ring" data-tip="' + esc('<b>' + esc(s.name || '') + '</b><br>' + esc(o.axes[i]) + ': ' + v) + '"/>';
      });
    });
    svg += '</svg>';
    if (o.series.length > 1) {
      svg += '<div class="legend">' + o.series.map(function (s) { return '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + '</span>'; }).join('') + '</div>';
    }
    return svg;
  }

  /* Global tooltip */
  function initTooltip() {
    var tip = document.createElement('div');
    tip.id = 'fdl-tip';
    document.body.appendChild(tip);
    document.addEventListener('mousemove', function (e) {
      var t = e.target.closest && e.target.closest('[data-tip]');
      if (!t) { tip.style.display = 'none'; return; }
      tip.innerHTML = t.getAttribute('data-tip');
      tip.style.display = 'block';
      var x = e.clientX + 14, y = e.clientY + 14;
      var r = tip.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
      tip.style.left = x + 'px'; tip.style.top = y + 'px';
    });
  }

  FDL.charts = { line: line, bars: bars, pairedH: pairedH, sparkline: sparkline, radar: radar, initTooltip: initTooltip };
})();

  <script>
/* ==========================================================================
   FACTORY DECISION LAB — AI Manufacturing Analyst (rule-based, case-bounded)
   원칙: Case 데이터 범위 안에서만 답변 / 원인을 직접 알려주지 않음 / 확인 질문으로 되돌려줌
   ========================================================================== */
(function () {
  var esc = FDL.escape;

  var DIM_WORDS = [
    ['eq', /(설비|eq-?\d*|리플로우|reflow|오븐)/i],
    ['lot', /(lot|로트|랏|페이스트|paste|솔더|원자재)/i],
    ['shift', /(작업조|야간|주간|조별|shift)/i],
    ['pcb', /(pcb|기판)/i],
    ['lane', /(lane|레인|마운터|mounter|실장기)/i],

  ];

  /* 가설/최종 원인 텍스트 분류 (평가에도 사용) */
  FDL.classify = function (text, cfg) {
    var t = String(text || '');
    var tags = {};
    if (/(lot|로트|랏|페이스트|paste|솔더|flux|플럭스|점도|원자재|자재)/i.test(t) && !/^\s*(pcb|기판)/i.test(t)) tags.material = true;
    var eqm = t.match(/eq-?0?([1-4])/i);
    if (eqm) {
      var id = 'EQ-0' + eqm[1];
      if (cfg && cfg.rootCause.eqId === id) tags.equipment = true; else tags.wrongEq = true;
    }
    if (!tags.wrongEq && /(열전대|히터|heater|thermocouple|tc 편차|온도 편차|실측|profiler|프로파일러)/i.test(t)) tags.equipment = true;
    if (!eqm && /(설비|리플로우|reflow|오븐)/i.test(t)) tags.equipmentGeneric = true;
    if (/(레시피|recipe|rev\.?\s?[cd]|셋팅|세팅|setting|changeover|체인지오버|모델 ?교체|설정 ?오류|조건 ?오류|로드)/i.test(t)) tags.setting = true;
    if (/(pcb|기판)/i.test(t)) tags.pcb = true;
    if (/(신규 ?작업자|신입|김oo|숙련도)/i.test(t)) tags.operator = true;
    if (/(노즐|nozzle|마운터|mounter|실장기)/i.test(t)) tags.nozzle = true;
    if (/(aoi|검사 ?프로그램|오검출|false ?call)/i.test(t)) tags.aoi = true;
    if (/(습도|공조|온습도)/i.test(t)) tags.humidity = true;
    return tags;
  };

  function Analyst(game) { this.g = game; }

  Analyst.prototype.table = function (rows, cols) {
    var h = '<table class="mini"><thead><tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (r) { h += '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table>';
  };

  Analyst.prototype.hint = function (level, text) {
    var h = FDL.DIFFICULTY[this.g.cfg.difficulty].hints;
    if (h === 'low') return '';
    if (level === 'high' && h !== 'high') return '';
    return '<p class="hint">💡 ' + text + '</p>';
  };

  Analyst.prototype.dims = function (q) {
    var out = [];
    DIM_WORDS.forEach(function (d) { if (d[1].test(q) && out.indexOf(d[0]) < 0) out.push(d[0]); });
    return out;
  };

  Analyst.prototype.period = function (q) {
    if (/(오늘|금일)/.test(q)) return 'today';
    if (/(24|하루|어제)/.test(q)) return '24h';
    return '48h';
  };

  Analyst.prototype.periodLabel = function (p) {
    return p === 'today' ? '오늘 08:00~현재' : p === '24h' ? '최근 24시간' : '최근 48시간';
  };

  Analyst.prototype.hidden = function (moduleId) {
    return !FDL.isVisible(this.g.cfg, moduleId);
  };

  Analyst.prototype.stratAnswer = function (dim, period) {
    if (this.hidden('quality.strat')) return this.notProvided();
    var m = this.g.model, rows = m.strat(dim, period);
    var max = Math.max.apply(null, rows.map(function (r) { return r.defect; }));
    var min = Math.min.apply(null, rows.map(function (r) { return r.defect; }));
    var html = '<p>' + esc(FDL.STRAT_DIMS[dim].label) + '별 불량률을 비교했습니다. <span class="muted">(' + this.periodLabel(period) + ')</span></p>';
    html += this.table(rows.map(function (r) {
      return ['<b>' + esc(r.label) + '</b>', '<span class="' + (r.defect === max && max - min > 1 ? 'hi' : '') + '">' + r.defect.toFixed(1) + '%</span>', r.units.toLocaleString()];
    }), [FDL.STRAT_DIMS[dim].label, '불량률', '생산수량']);
    var top = rows.filter(function (r) { return r.defect === max; })[0];
    if (max - min > 1.2) html += '<p>' + esc(top.label) + ' 에서 상대적으로 높은 불량률이 확인됩니다.</p>';
    else html += '<p>그룹 간 뚜렷한 차이는 관찰되지 않습니다.</p>';
    if (dim === 'eq') html += this.hint('mid', '특정 설비의 차이가 “언제부터” 시작됐는지, 다른 요인과 겹치는지도 확인해 보시겠습니까?');
    if (dim === 'lot') html += this.hint('mid', 'Lot 전환 시점과 불량 상승 시점이 일치하는지, 설비별로 동일하게 나타나는지 확인해 보시겠습니까?');
    if (dim === 'pcb' || dim === 'op' || dim === 'lane') html += this.hint('mid', '이 차이가 다른 변수와 겹쳐서(교란) 나타난 것은 아닌지 교차 분석으로 확인할 수 있습니다.');
    if (dim === 'shift') html += this.hint('mid', '조별 차이가 “사람” 때문인지, 그 시간대에 “무언가 바뀐 것” 때문인지 구분이 필요합니다.');
    return { html: html, key: 'strat.' + dim, label: 'AI 분석: ' + FDL.STRAT_DIMS[dim].label + '별 비교' };
  };

  Analyst.prototype.crossAnswer = function (a, b, period) {
    if (this.hidden('quality.cross')) return this.notProvided();
    var c = this.g.model.cross(a, b, period);
    var html = '<p>' + esc(FDL.STRAT_DIMS[a].label) + ' × ' + esc(FDL.STRAT_DIMS[b].label) + ' 교차 분석 결과입니다. <span class="muted">(' + this.periodLabel(period) + ')</span></p>';
    html += this.table(c.rows.map(function (r, i) {
      return ['<b>' + esc(r) + '</b>'].concat(c.m[i].map(function (cell) { return cell ? cell.v.toFixed(1) + '%' : '<span class="muted">—</span>'; }));
    }), [''].concat(c.cols));
    html += '<p>교차 조건에 따라 불량률 편차가 다르게 나타납니다. 어떤 조합에서 차이가 커지는지 확인해 보십시오.</p>';
    return { html: html, key: 'cross.' + [a, b].sort().join('x'), label: 'AI 분석: ' + FDL.STRAT_DIMS[a].label + ' × ' + FDL.STRAT_DIMS[b].label };
  };

  Analyst.prototype.notProvided = function () {
    return { html: '<p>해당 데이터는 이번 교육 세션에서 제공되지 않습니다. 다른 관점의 데이터로 판단해 주십시오.</p>', key: null, label: 'AI 질의 (비공개 데이터)' };
  };

  Analyst.prototype.answer = function (raw) {
    var q = String(raw || '').trim();
    var g = this.g, m = g.model, cfg = g.cfg, rc = cfg.rootCause, self = this;
    var snap = m.snapshot();
    if (this.hidden('analyst')) return { html: '<p>AI Analyst 가 비활성화되어 있습니다.</p>' };

    // 1) 정답 요구 → 원인 직접 제시 금지
    if (/(정답|답 ?알려|원인.*(뭐|무엇|알려|말해)|뭐가 문제|어떻게 해야|해결책|결론 ?내려)/.test(q)) {
      var notSeen = [];
      if (!g.evidence['strat.eq']) notSeen.push('설비별 비교');
      if (!g.evidence['strat.lot']) notSeen.push('원자재 Lot별 비교');
      if (!g.evidence['strat.shift']) notSeen.push('작업조별 비교');
      if (!g.evidence['history.changes']) notSeen.push('4M 변경점 이력');
      var html = '<p>원인에 대한 판단은 책임자님의 몫입니다. 저는 데이터 분석을 지원하겠습니다.</p>' +
        '<p>4M 관점(Man · Machine · Material · Method)으로 가설을 세우고, 각 가설을 지지/반박하는 데이터를 확인해 보시겠습니까?</p>';
      if (notSeen.length) html += this.hint('mid', '아직 확인하지 않은 관점: ' + notSeen.join(', '));
      return { html: html, key: null, label: 'AI 질의: 원인 문의', intent: 'ask_answer' };
    }

    // 2) 원인 단정 → 소크라테스식 되묻기
    if (/(원인|범인|때문|주범|확실)/.test(q) && /(네|다|야|같아|같은데|듯|맞지|맞아|확실|이군|인가\?*$|겠)/.test(q) && !/(비교|보여|분석|알려)/.test(q)) {
      var tags = FDL.classify(q, cfg);
      var subj = q.match(/eq-?0?[1-4]/i) ? q.match(/eq-?0?[1-4]/i)[0].toUpperCase() :
        tags.material ? '원자재 Lot' : tags.setting ? '공정조건/레시피' : tags.operator ? '작업자 요인' : tags.pcb ? 'PCB Lot' : '해당 요인';
      var html2 = '<p>현재 데이터에서는 <b>' + esc(subj) + '</b>와(과) 불량 간 연관성이 관찰됩니다.</p>' +
        '<p>다만 상관관계만으로 원인을 확정하기는 어렵습니다. <b>원인으로 확정하기 위해 어떤 정보를 추가로 확인하시겠습니까?</b></p>' +
        '<ul class="tight"><li>변화 시점과 불량 상승 시점이 일치하는가?</li><li>다른 요인과 겹쳐 나타난 것은 아닌가? (교차 분석)</li><li>그 요인만 제거·변경했을 때 불량이 재현/해소되는가?</li><li>하나의 요인으로 전체 현상이 설명되는가?</li></ul>';
      return { html: html2, key: null, label: 'AI 대화: 원인 주장 “' + q.slice(0, 40) + '”', intent: 'claim' };
    }

    // 3) 교차 분석
    var dims = this.dims(q);
    var period = this.period(q);
    if (dims.length >= 2 && /(교차|별로|×|조합|같이|함께|나눠|x)/i.test(q)) return this.crossAnswer(dims[0], dims[1], period);

    // 4) 레시피/공정조건
    if (/(레시피|recipe|rev|버전|프로파일|profile|셋팅|세팅|setting|공정 ?조건|설정 ?온도|존 ?온도|zone)/i.test(q)) {
      var html3 = '<p>Reflow 설비별 현재 로드 레시피와 주요 설정값입니다.</p>';
      html3 += this.table(FDL.EQUIPMENT.map(function (id) {
        var z = m.zoneTable(id);
        return ['<b>' + id + '</b>', 'PM220_RF_' + m.recipeOf(id), z[2].sv + ' / ' + z[3].sv, z[5].sv, z[5].out + '%'];
      }), ['설비', '레시피', 'Soak Z3/Z4(°C)', 'Peak Z6(°C)', 'Z6 Heater 출력']);
      html3 += '<p class="muted">※ 표시 온도는 설비 자체 열전대 기준값입니다. 실제 기판 온도는 Profiler 실측(설비 점검) 시 확인 가능합니다.</p>';
      html3 += this.hint('mid', '레시피 변경 이력과 설비별 설정 차이가 언제, 누구에 의해 생겼는지 작업일지에서 확인할 수 있습니다.');
      return { html: html3, key: 'analyst.recipe', label: 'AI 분석: 설비별 레시피/공정조건' };
    }

    // 5) 변경점
    if (/(달라진|변경|변화|바뀐|차이점|4m|어제와)/i.test(q)) {
      if (this.hidden('history.changes')) return this.notProvided();
      var html4 = '<p>최근 48시간 등록된 4M 변경점입니다. (변경점 관리대장 기준)</p>';
      html4 += this.table(g.changeLog().map(function (c) { return [c.when, c.cat, esc(c.item)]; }), ['일시', '구분', '변경 내용']);

    // 6) 단일 차원 층별

    // 7) 추이/시간

      html5 += '<p>상승이 관찰되는 구간이 있습니다. 해당 시각 전후의 변경 사항과 대조해 보시겠습니까?</p>';
      return { html: html5, key: 'quality.hourly', label: 'AI 분석: 시간대별 추이' };
    }

    if (/(유형|pareto|파레토|모드|종류)/i.test(q)) {
      var p = m.pareto();
      var html6 = '<p>불량 유형별 비율 (평시 → 현재, 라인 불량률 기여 %p)</p>' + this.table(p.map(function (r) { return [esc(r.label), r.baseline.toFixed(2), '<b>' + r.today.toFixed(2) + '</b>']; }), ['유형', '평시', '현재']);
      html6 += '<p>증가폭이 큰 유형이 어느 공정(인쇄·실장·리플로우)과 관련이 깊은지 생각해 보십시오.</p>';
      return { html: html6, key: 'quality.pareto', label: 'AI 분석: 불량 유형' };
    }

    if (/(습도|온습도|환경|공조)/.test(q)) {
      return { html: '<p>SMT 동 공조: 온도 24.1°C / 습도 55~58%RH (관리기준 40~60%RH, 어제 19:30 설정 50→55% 변경). 관리기준 내에서 운영 중입니다.</p>', key: 'env.humidity', label: 'AI 분석: 환경 조건' };
    }
    if (/(aoi|검사기|오검출|false)/i.test(q)) {
      return { html: '<p>AOI-01 프로그램 v3.2 (D-2 16:00 업데이트). False Call 률 0.8% → 0.9%. X-ray 샘플 재판정 결과 AOI 불량 판정 일치율 97% 입니다.</p>', key: 'aoi', label: 'AI 분석: AOI 검사' };
    }
    if (/(알람|alarm|경고)/i.test(q)) {
      var rows = [];

    }
    if (/(타 ?라인|line ?3|라인 ?3|다른 라인)/i.test(q)) {
      if (!m.s.unlocked.line3) return { html: '<p>현재 타 라인에서 보고된 이상 정보는 없습니다.</p>', key: null, label: 'AI 질의: 타 라인' };
      return { html: '<p>' + g.line3Text() + '</p>', key: 'line3', label: 'AI 분석: 타 라인 정보' };
    }
    if (/(재고|대체)/.test(q)) {
